<!DOCTYPE html>
<html lang="fr">
<head>
<script>try{var d=document.documentElement,t=localStorage.getItem('wtheme'),z=localStorage.getItem('wzoom');if(t)d.dataset.theme=t;if(z)d.style.zoom=z}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181F">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@500;700&display=swap" rel="stylesheet">
<title>Watson</title>
<style>
:root{
  --fs:15px; --fs-ref:calc(var(--fs)*1.2); --fs-t:calc(var(--fs)*1.5); --fs-b:calc(var(--fs)*1.2);
  --bg:#15181F; --panel:#1D222C; --raised:#272E3B; --line:#343C4C;
  --ink:#F1F4FA; --mut:#A3AEC2; --hi:#fff; --hov:var(--hov); --hov2:var(--hov2); --bd2:var(--bd2); --bd3:var(--bd3); --hair:var(--hair); --scrim:rgba(10,12,16,.66); --hdr:rgba(21,24,31,.97); --t1:#2a3242; --t2:#232a39;
  --blue:#3A8CFF; --orange:#FF5A2B; --green:#3ECF8E; --red:#FF5C5C;
  --ease:cubic-bezier(.2,.8,.2,1);
  --body:'DM Sans',system-ui,sans-serif; --disp:'Sora','DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font:16.5px/1.5 var(--body);color:var(--ink);min-height:100vh}
/* v4.32 : fond en calque fixe (plus de repeinture à chaque défilement) */
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 420px at 85% -10%,rgba(74,148,255,.14),transparent 60%),
  radial-gradient(700px 380px at -10% 110%,rgba(255,90,42,.08),transparent 60%)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- En-tête */
header{display:flex;align-items:center;gap:10px;padding:10px 20px;position:sticky;top:0;z-index:5;
  background:var(--hdr);border-bottom:1px solid var(--line);min-height:62px}
.logo{display:flex;align-items:center;gap:12px;flex:1;font:700 22px var(--disp);letter-spacing:.2px}
.logo img{height:40px;width:auto;aspect-ratio:1/1;object-fit:contain;display:block}
.ver{font:700 12px var(--disp);letter-spacing:.4px;color:#ff7a50;border:1px solid rgba(255,90,42,.55);background:rgba(255,90,42,.12);border-radius:8px;padding:2px 8px;margin-left:-2px;align-self:center}
#who{color:var(--mut);font-weight:500}
#sync{font-size:var(--fs);font-weight:500;color:var(--mut);display:flex;align-items:center;gap:7px}
#sync .d3{display:flex;gap:4px;align-items:center;height:14px}
#sync .d3 i{width:11px;height:11px;border-radius:50%;background:var(--green);transition:background .3s,width .2s,height .2s}
#sync .d3 i:nth-child(n+2){display:none}
#sync.work .d3 i{display:block;width:5px;height:5px;background:var(--orange);animation:dj2 .9s ease-in-out infinite}
#sync.work .d3 i:nth-child(2){animation-delay:.15s}#sync.work .d3 i:nth-child(3){animation-delay:.3s}
#sync.err .d3 i{background:var(--red)}
.ico{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:transparent;border:1px solid transparent;color:var(--ink);cursor:pointer;font-size:17px;transition:background .18s,border-color .18s,transform .18s var(--ease),color .18s}
.ico:hover{background:var(--raised);border-color:var(--line);transform:translateY(-1px);color:var(--hi)}
.ico.on{background:var(--raised);border-color:var(--blue);color:var(--blue)}
.ico.warn:hover{color:var(--orange);border-color:rgba(255,90,42,.5)}
.ico.sm{width:38px;height:38px}
/* ---------- Tuiles de modules */
nav{display:flex;justify-content:center;padding:20px 16px 4px}
.mods{display:flex;flex-wrap:wrap;gap:14px;width:100%;justify-content:center}
.mod{flex:1 1 170px;max-width:280px;position:relative;display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;color:var(--mut);overflow:hidden;
  transition:transform .22s var(--ease),border-color .22s,box-shadow .22s,background .22s,color .22s}
.mod:hover{transform:translateY(-3px);border-color:var(--bd2);color:var(--hi);background:var(--hov)}
.mod .mi{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--raised);font-size:19px;transition:background .22s,color .22s}
.mod small{white-space:nowrap}
.mod b{display:block;font:700 var(--fs-b) var(--disp);color:inherit;letter-spacing:.3px}
.mod small{display:block;font:500 var(--fs) var(--body);color:var(--mut);margin-top:1px}
.mod small i{font-style:normal;color:#ff8d70;font-weight:700}
.mod.on{color:var(--hi);border-color:var(--blue);background:linear-gradient(135deg,rgba(58,140,255,.22),rgba(58,140,255,.06));box-shadow:0 8px 26px rgba(58,140,255,.25)}
.mod.on .mi{background:var(--blue);color:#fff}
main{padding:14px 22px 50px;max-width:1500px;margin:0 auto}

/* ---------- Champs et boutons */
input,select,textarea{font:inherit;color:var(--ink);padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);width:100%;transition:border-color .18s,box-shadow .18s,background .18s}
input:hover,select:hover,textarea:hover{border-color:var(--bd3)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,148,255,.25)}
select option{background:var(--panel)}
.up{text-transform:uppercase}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
.bar{align-items:center}
button{font-family:inherit;cursor:pointer}
.p{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:var(--orange);color:#1a1206;border:0;border-radius:11px;padding:12px 20px;font:700 var(--fs-b) var(--disp);transition:transform .18s var(--ease),box-shadow .18s,filter .18s}
.p:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,90,42,.38);filter:brightness(1.06)}
.p:active{transform:translateY(0) scale(.97)}
.s{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:10px 15px;font:500 var(--fs-b) var(--body);transition:border-color .18s,background .18s,transform .18s var(--ease),color .18s}
.s:hover{border-color:var(--blue);color:var(--hi);background:var(--hov2);transform:translateY(-1px)}
.s:active{transform:scale(.96)}
.s.go{border-color:rgba(74,148,255,.55);color:#d3e4ff}
.s[disabled],.p[disabled],.ico[disabled]{opacity:.45;pointer-events:none}

/* ---------- Cartes */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:800px){.grid{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px 16px 11px 22px;overflow:hidden;cursor:pointer;
  transition:transform .22s var(--ease),border-color .22s,box-shadow .22s,background .22s}
.card{display:flex;flex-direction:column}
.card>*{position:relative;z-index:1}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rail,var(--line));transition:width .22s var(--ease)}
.card:hover{transform:translateY(-3px);border-color:var(--bd2);background:var(--hov);box-shadow:0 14px 34px rgba(0,0,0,.38)}
.card:hover:before{width:9px}
.card.st-go{--rail:var(--blue)} .card.st-ok{--rail:var(--green)}
.card.tmp{opacity:.72;animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
/* Pulsation « urgent » : une seule horloge globale (:root) => toutes les cases clignotent ensemble, sans jamais redémarrer */
@property --pw{syntax:'<number>';inherits:true;initial-value:0}
html.pulse{animation:pw 3.4s ease-in-out infinite}
@keyframes pw{0%,100%{--pw:0}50%{--pw:1}}
.urgb{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;flex:none;color:#ff5c5c;background:rgba(255,70,70,.1);
  border:2px solid color-mix(in srgb,rgba(255,84,84,.95) calc(var(--pw) * 100%),rgba(255,84,84,.22))}
.urgb svg{width:13px;height:13px}
/* Mise à jour en cours : case floutée + 3 points ; puis vague verte du centre vers l'extérieur */
.card>*{transition:filter .25s,opacity .25s}
.card.sync.tmpc{pointer-events:none}
.card.sync>*:not(.dots){filter:blur(3.5px);opacity:.55}
.dots{pointer-events:none;position:absolute!important;inset:0;z-index:3!important;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:inherit;background:radial-gradient(ellipse at 50% 50%,rgba(6,8,12,.72) 0,rgba(6,8,12,.5) 35%,rgba(6,8,12,.16) 75%,transparent 100%)}
.dots i{width:11px;height:11px;border-radius:50%;background:#fff;opacity:.9;animation:dj 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dj2{0%,70%,100%{transform:translateY(0);opacity:.55}35%{transform:translateY(-5px);opacity:1}}
.d3s{display:inline-flex;gap:3px;align-items:center;height:13px;vertical-align:middle}.d3s i{width:4px;height:4px;border-radius:50%;background:var(--mut);animation:dj2 .9s ease-in-out infinite}.d3s i:nth-child(2){animation-delay:.15s}.d3s i:nth-child(3){animation-delay:.3s}
@keyframes dj{0%,70%,100%{transform:translateY(0);opacity:.55}35%{transform:translateY(-9px);opacity:1}}
.card.wave:after{content:"";position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;z-index:4;pointer-events:none;
  background:radial-gradient(circle,rgba(62,207,142,0) 38%,rgba(62,207,142,.5) 60%,rgba(62,207,142,0) 72%);animation:wv 1.1s ease-out forwards}
@keyframes wv{from{transform:scale(0);opacity:1}to{transform:scale(16);opacity:0}}
.r1,.r2{display:flex;align-items:center;gap:10px;min-width:0}
.r1 .name,.r1 .refs{flex:1;min-width:0}
.name{font:700 var(--fs-t)/1.25 var(--disp);color:var(--hi);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.refs{display:flex;gap:4px 16px;flex-wrap:wrap;margin:3px 0 1px;flex:1}
.ref{font:700 var(--fs-ref) var(--disp);letter-spacing:.3px;color:#9cc3ff;text-decoration:none;border-bottom:1px solid transparent;transition:color .15s,border-color .15s;word-break:break-all}
.ref:hover{color:var(--hi);border-color:var(--orange)}
.refs.solo{margin:0}.refs.solo .ref{font-size:var(--fs-ref)}
.ref small{font:500 var(--fs) var(--body);color:var(--mut);margin-right:5px}
.bub{display:inline-flex;align-items:center;gap:5px;flex:none;font:700 var(--fs) var(--disp);color:#ffb9a0;background:rgba(255,90,42,.16);border:1px solid rgba(255,90,42,.4);border-radius:999px;padding:3px 11px 3px 8px}
.bub svg{width:1em;height:1em}
.m{color:var(--mut);font-size:var(--fs);margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m.cat{color:#ff9d80;font-weight:700;font-size:var(--fs)}
.tag{font-size:var(--fs);font-weight:700;border-radius:9px;padding:3px 10px;background:var(--raised);color:var(--mut);white-space:nowrap;flex:none}
.tag.go{background:#27497e;color:#d3e4ff}
.tag.ok{background:#1d5a45;color:#bff3d9}
.tag.u{background:#6a2b30;color:#ffc9c9}
.tag.pr{background:rgba(255,255,255,.09);color:var(--ink)}
.act{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:auto;padding-top:10px}
.act .s{padding:8px 22px}.act .s.stp{padding:8px 18px}
.empty{color:var(--mut);padding:40px 0;text-align:center}

/* ---------- Menu des étapes : bandeau au milieu de la page */
#mBand{z-index:70}
#mBand .sheet{max-width:1000px;width:94vw;border-radius:20px;padding:22px 22px 24px}
.bt{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.bt b{font:700 var(--fs-t) var(--disp);color:var(--hi);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt span{color:var(--mut);font-size:var(--fs)}
.flow{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:4px 0 2px}
.flow .stp{flex:1 1 0;min-width:140px;display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:0;color:var(--mut);font:500 var(--fs)/1.25 var(--body);padding:4px 8px;text-align:center;position:relative;transition:color .15s,transform .18s var(--ease)}
.flow .stp:hover{color:var(--hi)}.flow .stp:hover .dot{transform:scale(1.18)}.flow .stp.cur:hover .dot{transform:none}
.flow .stp .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 var(--fs) var(--disp);background:var(--bg);border:2px solid var(--line);color:var(--mut);z-index:1;transition:transform .18s var(--ease),background .15s,border-color .15s}
.flow .stp:hover .dot{border-color:var(--blue)}
.flow .stp:not(:last-child):after{content:"";position:absolute;top:24px;left:calc(50% + 26px);right:calc(-50% + 26px);height:2px;background:var(--line)}
.flow .stp.done .dot{background:rgba(62,207,142,.2);border-color:var(--green);color:var(--green)}
.flow .stp.done:not(:last-child):after{background:var(--green)}
.flow .stp.cur{color:var(--hi);cursor:default}
.flow .stp.cur .dot{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 6px rgba(58,140,255,.25)}
.flow .stp .wh{font:500 var(--fs)/1.3 var(--body);color:var(--mut);min-height:2.6em}
.flow .stp .wh b{display:block;color:var(--ink);font-weight:700}
.flow .stp.none .wh{opacity:.4}

/* ---------- Fenêtres */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .22s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{background:var(--panel);border:1px solid var(--line);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px;transform:translateY(40px);transition:transform .3s var(--ease)}
.sheet.wide{max-width:740px}
.modal.on .sheet{transform:none}
@media(min-width:800px){.modal{align-items:center}.sheet{border-radius:20px;transform:translateY(18px) scale(.96)}.modal.on .sheet{transform:none}}
.sh{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.sh .tt{flex:1;min-width:0}
.sh h3{font:700 var(--fs-t)/1.2 var(--disp);margin:0;word-break:break-word}
.sh .sub{color:var(--mut);font-size:var(--fs);margin-top:2px}
label{display:block;font-weight:500;color:var(--mut);margin:14px 0 6px;font-size:var(--fs)}
.row{display:flex;gap:8px}.row>button{white-space:nowrap}
.chk{display:flex;align-items:center;gap:11px;color:var(--ink);font-weight:500;margin:10px 0;cursor:pointer;font-size:16px}
.chk input{width:20px;height:20px;accent-color:var(--blue);padding:0}
.multi{display:grid;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 12px}
.det{display:grid;grid-template-columns:150px 1fr;gap:4px 16px;margin-top:10px}
.det .pr{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:7px 0;border-bottom:1px solid var(--hair)}
.det .pr small{display:block;color:var(--mut);font-size:var(--fs);margin-bottom:2px}
.det dt{color:var(--mut);font-size:var(--fs);padding:7px 0;border-bottom:1px solid var(--hair)}
.det dd{margin:0;padding:7px 0;border-bottom:1px solid var(--hair);word-break:break-word;min-height:2.2em}
.det dd.none{color:#5f6a7e}
.det dd{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.det dd>input:not([type=checkbox]),.det dd>select,.det dd>textarea,.det dd .row{flex:1;min-width:0}
.det dd input:not([type=checkbox]),.det dd select,.det dd textarea{padding:4px 10px;font-size:var(--fs);border-radius:8px;line-height:1.4}
.det dd textarea{resize:none;overflow:hidden;display:block}
.det dd .row input{flex:1;min-width:0}
.det dd .chk{margin:2px 0}
.det dd input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);padding:0}
.det dd.ed{padding:3px 0}
.bbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bb{display:inline-flex;align-items:center;gap:6px;font:700 var(--fs) var(--disp);border-radius:999px;padding:4px 12px 4px 9px;background:var(--raised);color:var(--ink);border:1px solid var(--line)}
.bb svg{width:1.05em;height:1.05em}
.bb.u{background:rgba(255,70,70,calc(.1 + var(--pw) * .14));border-color:rgba(255,84,84,.55);color:#ff9d9d}
.bb.wk{color:#ff9d9d;border-color:rgba(255,84,84,.55);background:rgba(255,70,70,.14)}
html[data-theme=light] .bb.wk{color:#C22B31}
.bb.sh{color:#a9cbff;border-color:rgba(58,140,255,.45);background:rgba(58,140,255,.14)}
.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.dt3{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px 11px;overflow:hidden}
.dt3:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.dt3 small{display:block;font:700 var(--fs) var(--disp);letter-spacing:.5px;color:var(--mut)}
.dt3 b{display:block;font:700 var(--fs-ref) var(--disp);color:var(--hi);margin-top:2px}
.dt3 span{font-size:var(--fs);color:var(--mut)}
.dt3.now:before{background:var(--blue)} .dt3.warn:before{background:#ff9f1a}.dt3.warn{border-color:rgba(255,159,26,.6)}.dt3.warn b{color:#ffc47d} .dt3.late:before{background:#ff3b3b}.dt3.late{animation:dflash 1.1s ease-in-out infinite;border-color:rgba(255,60,60,.7)} .dt3.late b{color:#ff9d9d}
.dstat{display:flex;align-items:center;gap:10px;margin:10px 0 4px;transition:opacity .2s}
.dstat .sp{flex:1}
.dstat.lock{opacity:.4;pointer-events:none}
.ico.ok{color:var(--green);border-color:rgba(62,207,142,.5)}
.ico.ok:hover{background:rgba(62,207,142,.18);color:var(--hi)}
.sec{font:700 var(--fs) var(--disp);margin:22px 0 4px;color:var(--ink)}
.hist{display:grid;gap:0;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:150px 1fr;gap:4px 16px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:var(--fs)}
.hist .hd{color:var(--mut);font-size:var(--fs)}
.hist .hw{color:var(--mut);font-size:var(--fs)}
.hist .hwho{color:var(--hi)}.hist .hch{margin-top:3px;color:var(--ink);font-size:var(--fs);word-break:break-word}.hist .hd b{color:var(--ink)}
.hist .arr{color:var(--orange);margin:0 4px}
#mAsk{z-index:90}
#mAsk .sheet{max-width:420px}
#mAsk p{color:var(--mut);margin:8px 0 0}
.foot{display:flex;gap:10px;margin-top:20px}
#scan video{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover}
.frame{position:relative}
.frame:after{content:"";position:absolute;left:12%;right:12%;top:40%;height:20%;border:2px solid var(--orange);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.ids{display:grid;grid-template-columns:1fr;gap:18px;margin:16px 0;justify-items:center}
.idc{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.idc b{display:block;font:700 var(--fs) var(--disp);margin-bottom:10px}
.qrt{background:#fff;border-radius:10px;padding:8px;display:inline-block;line-height:0}
.idc .s{margin-top:12px;width:100%}

/* ---------- Attente (flou + blocage) */
#busy{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,rgba(6,8,12,.86) 0,rgba(6,8,12,.66) 24%,rgba(10,13,18,.34) 52%,rgba(15,18,24,.1) 80%);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .2s;cursor:wait}
#busy.on{opacity:1;pointer-events:auto}
#busy .boxes{display:flex;flex-direction:column;gap:26px;align-items:center}
#busy .bx{width:128px;height:128px;fill:none;stroke:var(--orange);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;animation:bxg 2.4s ease-in-out infinite}

.trow{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:7px}

.hide{display:none!important}
@media(max-width:700px){.mods{gap:8px}.mod{flex:1 1 30%;max-width:none;flex-direction:column;text-align:center;padding:10px 6px;gap:6px}.mod small{font-size:var(--fs)}.mod b{font-size:var(--fs-b)}.det,.hist li{grid-template-columns:1fr}.flow .stp{min-width:96px;font-size:var(--fs)}}

.drawer{display:flex;flex-direction:column;overflow:hidden}

.trow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;overflow:hidden;padding:8px 10px 8px 17px}

/* ---------- Mode jour */
html[data-theme=light]{--bg:#F2F4F8;--panel:#FFFFFF;--raised:#E8ECF3;--line:#D3D9E5;--ink:#1B2230;--mut:#5A667C;--hi:#0D1320;--hov:#F5F7FB;--hov2:#DDE3EE;--bd2:#9AA7BE;--bd3:#B3BDD0;--hair:rgba(20,30,50,.08);--scrim:rgba(30,40,60,.38);--hdr:rgba(255,255,255,.88);--t1:#FFFFFF;--t2:#F4F6FA;--blue:#2F78E6;--green:#1FA56F;--red:#E5484D}

/* v4.28 */
.ref{text-decoration:none}
.ref:hover{color:#9cc3ff;border-color:transparent;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:currentColor}

.card.sync>*:not(.dots){filter:none;opacity:1}.card.sync.tmpc{opacity:.78}.card .dots,.trow .dots,#sDet>.dots{display:none!important}
.trow.sync>*:not(.dots){filter:none;opacity:1}

.cmr.sync{opacity:.75;filter:none}
.badge.tdb{background:var(--blue);right:21px}
.mod[data-m=DOCUMENTS],.mod[data-m=LIBRARY]{--mc:150,104,240}
.card.dcc{--rail:#9b6cff}
.sheet.xl{max-width:1100px}
.snav{top:0}
.set.inmodal{margin-top:10px}
/* Bibliothèque */
.lbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.lsearch{position:relative;flex:1 1 260px;max-width:460px}.lsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mut)}.lsearch input{padding-left:38px}
.ltags{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.tgc{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--mut);font:600 var(--fs) var(--body);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.tgc small{opacity:.7;font-size:var(--fs)}
.tgc:hover{color:var(--hi);border-color:var(--bd2)}
.tgc.on{background:rgba(150,104,240,.22);border-color:#9b6cff;color:#e3d4ff}
html[data-theme=light] .tgc.on{color:#5a2fb3}
.tgc.sm{height:22px;padding:0 9px;cursor:default;font-size:var(--fs)}
.lgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:800px){.lgrid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}}
.card.lib{--rail:#9b6cff;gap:6px}

.card.lib .ltt{font:700 var(--fs-ct) var(--disp);color:var(--hi);word-break:break-word}
.card.lib .lex{color:var(--mut);font-size:var(--fs);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.lib .ltg{display:flex;flex-wrap:wrap;gap:5px}
.card.lib .lic{display:flex;gap:12px;color:var(--mut);font-size:var(--fs)}.card.lib .lic span{display:inline-flex;align-items:center;gap:4px}.card.lib .lic svg{width:15px;height:15px}
.card.lib .lby{margin-top:auto;color:var(--mut);font-size:var(--fs);padding-top:4px}
.lbt{display:flex;gap:8px;align-items:center}
.rich{line-height:1.55;word-break:break-word;font-size:var(--fs-b)}
.rich h3{font:700 var(--fs-t) var(--disp);margin:12px 0 4px}.rich p,.rich div{margin:0 0 6px}.rich ul,.rich ol{margin:4px 0 8px;padding-left:24px}.rich blockquote{margin:6px 0;padding:2px 12px;border-left:3px solid #9b6cff;color:var(--mut)}
.rich a{color:#9cc3ff;text-decoration:none}.rich a:hover{text-decoration:underline;text-underline-offset:3px}
html[data-theme=light] .rich a{color:#1F5FC9}
.rte{min-height:150px;max-height:340px;overflow:auto;padding:12px 13px;border:1px solid var(--line);border-radius:0 0 10px 10px;background:var(--panel);outline:none}
.rte:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,140,255,.18)}
.rtb{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--raised)}
.rtb button{min-width:34px;height:32px;padding:0 9px;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--ink);font:600 var(--fs-b) var(--body);cursor:pointer}
.rtb button:hover{background:var(--panel);border-color:var(--line)}
.rtl{display:none;gap:8px;padding:8px 6px 0}.rtl.on{display:flex}.rtl input{padding:6px 10px}
.tgin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tgin input{flex:1;min-width:140px;border:0;background:transparent;padding:5px 4px;box-shadow:none}
.tgin .tgc{cursor:default}.tgin .tgc b{cursor:pointer;font-weight:700;opacity:.7}.tgin .tgc b:hover{opacity:1}
.lln{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-bottom:8px;align-items:center}
.llk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.llk:first-child{border-top:0}.llk svg{width:17px;height:17px;color:var(--mut);flex:none}.llk small{display:block;color:var(--mut)}
.llk a{color:#9cc3ff;text-decoration:none;font-weight:600;word-break:break-all}.llk a:hover{text-decoration:underline;text-underline-offset:3px}
html[data-theme=light] .llk a{color:#1F5FC9}
.lph{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.vis2{display:flex;gap:8px;margin-top:6px}.vis2 button{flex:1}
.vis2 button.on{border-color:#9b6cff;background:rgba(150,104,240,.2);color:var(--hi)}
@media(max-width:700px){.lln{grid-template-columns:1fr}}
/* v4.28 : bandeau supérieur toujours sombre, même en mode jour */
html[data-theme=light] header{--bg:#15181F;--panel:#1D222C;--raised:#272E3B;--line:#343C4C;--ink:#F1F4FA;--mut:#A3AEC2;--hi:#fff;--hov:#232a39;--hov2:#2a3242;--bd2:#4a5468;--bd3:#3d4658;--hdr:rgba(21,24,31,.96);color:var(--ink)}

#mSearch .sheet{max-width:920px}
.sug .sn{flex:1.25;min-width:0;color:var(--mut);font-size:calc(var(--fs)*.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--line);padding-left:12px}
.sug .sn em{font-style:normal;font-weight:700;margin-right:6px;opacity:.75}

@media (max-width:760px){.sug button{flex-wrap:wrap}.sug .sn{flex-basis:100%;border-left:0;padding-left:46px;flex:none}}

async function delRec(r){
  const m = cur, direct = ME.rights[m] === 'admin' || String(r.cree_par).toLowerCase() === ME.email;
  if (!direct) return toast('Seul le créateur ou un administrateur peut supprimer ce dossier');
  const ok = await ask(direct ? 'Supprimer ce dossier ?' : 'Demander la suppression ?', direct ? 'Le dossier, ses commentaires et ses fichiers seront supprimés définitivement.' : 'Le créateur devra valider la suppression. En attendant, le dossier reste visible avec la mention « En attente de suppression ».', direct ? 'Supprimer' : 'Demander');
  if (!ok) return;
  if (direct) {
    const k = key(), before = (cache[k] || rows).slice(); closeDet();
    fadeOut(r, () => { cache[k] = (cache[k] || []).filter(x => x.id !== r.id); if (key() === k) { rows = cache[k]; drawCards(); } });
    drawCards();
    enqueue(() => api('delete_request', {module:m, id:r.id}), () => { r._gone = 0; cache[k] = before; if (key() === k) { rows = before; drawCards(); } });
  } else {
    r.suppr_par = ME.email; syncOn(r); drawCards(); if (det && det.r === r) renderDet();
    enqueue(async () => { await api('delete_request', {module:m, id:r.id}); syncOff(r); if (key() === m || key() === m + '_a') drawCards(); if (det && det.r === r) renderDet(); },
      () => { syncOff(r); r.suppr_par = ''; if (cur === m) drawCards(); if (det && det.r === r) renderDet(); });
  }
}
function saveLocal(r, data, extra){
  const m = cur, k = key(), now = new Date().toISOString();
  if (r) { if (H[r.id]) Object.keys(data).forEach(f => { if (String(r[f] ?? '') !== String(data[f] ?? '')) H[r.id].unshift({date_heure:now, utilisateur:ME.email, action:'modification', champ:f, ancienne_valeur:r[f] ?? '', nouvelle_valeur:data[f]}); }); Object.assign(r, data, {modifie_le: now}); syncOn(r); }
  else {
    const row = Object.assign({id:'tmp_' + Date.now(), cree_par:ME.email, cree_le:now, etape:(stepsOf(m)[0] || {}).code || '', etape_par:ME.email, etape_le:now, archive:false, _tmp:true}, data, extra && extra.files ? {fichiers: extra.files.map(f => ({id:'tmp', nom:f.name, taille:f.size}))} : {}, extra && extra.photos && extra.photos[0] ? {thumb: extra.photos[0].thumb} : {});
    rows.unshift(row); cache[k] = rows;

  enqueue(async () => {
    const newId = await api('save', {module:m, id: r ? r.id : null, data});
    if (!r && extra && newId) {
      for (const f of (extra.files || [])) await api('file_add', {module:m, ref_id:newId, name:f.name, mime:f.mime, b64:f.b64});
      for (const ph of (extra.photos || [])) await api('file_add', {module:m, ref_id:newId, name:ph.name, mime:ph.mime, b64:ph.b64, thumb_b64:ph.thumb});
    }
    if (r) { delete H[r.id]; syncOff(r); if (det && det.r === r && !det.editing) renderDet(); }
    if (pending === 1) await refresh(); else if (key() === k) drawCards();
    if (key() === k) { let id = r && r.id; if (!id) { const f = rows.filter(x => x.cree_par === ME.email && (!data.waybill || x.waybill === data.waybill)).sort((a, b) => String(b.cree_le).localeCompare(String(a.cree_le)))[0]; id = f && f.id; } if (id) waveCard(id); }
  }, async () => { if (r) { syncOff(r); if (det && det.r === r && !det.editing) renderDet(); } try { await refresh(); } catch (e) {} });

    const rp = e.target.closest('[data-rp]'); if (rp) { e.preventDefault(); libSyncForm(); const p = L.photos.splice(+rp.dataset.rp, 1)[0]; if (p.id) L.rm.push(p.id); return drawLibEdit(); }
    const v = e.target.closest('[data-v]'); if (v) { libSyncForm(); L.vis = v.dataset.v; return drawLibEdit(); }
    if (e.target.closest('#lAddL')) { libSyncForm(); L.liens.push({titre: '', url: ''}); drawLibEdit(); const r = document.querySelectorAll('#lLinks .lln .lt'); if (r.length) r[r.length - 1].focus(); return; }
    if (e.target.closest('#lOk') || e.target.closest('#lOk2')) return libSave();
    if (e.target.closest('#lNo') || e.target.closest('#lNo2')) { const it = L.id ? libItems().find(x => x.id === L.id) : null; LIB.edit = null; if (it) { drawLibView(it); } else closeLib(); return; }
  };
  el.onchange = async e => {
    if (e.target.id === 'lDocIn') { const fs = [...e.target.files]; e.target.value = ''; const big = fs.find(f => f.size > 8 * 1024 * 1024); if (big) return toast('« ' + big.name + ' » dépasse 8 Mo');
      let list; try { list = await wait(async () => { const o = []; for (const f of fs) o.push({nom: f.name, mime: f.type || 'application/octet-stream', b64: await readB64(f), taille: f.size, _new: true}); return o; }); } catch (err) { return toast(err.message); }
      libSyncForm(); L.docs = L.docs.concat(list); drawLibEdit(); }
    if (e.target.id === 'lPhIn') { const fs = [...e.target.files]; e.target.value = '';
      let list; try { list = await wait(async () => { const o = []; for (const f of fs) { const p = await compressImg(f); o.push({nom: p.name, mime: p.mime, b64: p.b64, thumb: p.thumb, src: 'data:image/jpeg;base64,' + p.thumb, _new: true}); } return o; }); } catch (err) { return toast(err.message); }
      libSyncForm(); L.photos = L.photos.concat(list); drawLibEdit(); }
  };
}
function libSave(){
  libSyncForm(); const L = LIB.edit; if (!L) return;
  const titre = L.titre.trim(); if (!titre) return toast('Le titre est obligatoire');
  const liens = L.liens.map(l => ({titre: l.titre.trim(), url: l.url.trim()})).filter(l => l.url);
  const bad = liens.find(l => !/^(https?:\/\/)?[^\s/]+\.[^\s]+$/i.test(l.url)); if (bad) return toast('Lien invalide : ' + bad.url);
  let txt = cleanHtml(L.texte); if (!htmlText(txt)) txt = '';
  const data = {titre, texte: txt, liens, mots_cles: L.tags.join(', '), visibilite: L.vis};
  const now = new Date().toISOString(), newDocs = L.docs.filter(d => d._new), newPh = L.photos.filter(p => p._new), rm = L.rm.slice();
  const keepF = (L.id ? (libItems().find(x => x.id === L.id).fichiers || []) : []).filter(f => !rm.includes(f.id));
  let it = L.id ? libItems().find(x => x.id === L.id) : null;
  if (!it) { it = {id: 'tmp_' + Math.random().toString(36).slice(2), cree_par: ME.email, par: ME.prenom, cree_le: now, fichiers: []}; cache.LIBRARY = [it].concat(libItems()); }
  const first = L.photos[0];
  Object.assign(it, {titre, texte: txt, liens: JSON.stringify(liens), mots_cles: data.mots_cles, visibilite: L.vis, modifie_le: now,
    fichiers: keepF.concat(newDocs.map(d => ({id: 'tmp_' + Math.random().toString(36).slice(2), nom: d.nom, taille: d.taille, mime: d.mime, kind: 'doc'})), newPh.map(p => ({id: 'tmp_' + Math.random().toString(36).slice(2), nom: p.nom, mime: p.mime, kind: 'photo'})))});
  if (first && first.thumb) it.thumb = first.thumb; else if (!L.photos.length) delete it.thumb;
  const realId = L.id; delete LIBF[realId];
  LIB.edit = null; closeLib(); libDraw();
  enqueue(async () => {
    const id = await api('lib_save', {id: realId || undefined, data});
    for (const f of rm) await api('file_delete', {id: f});
    for (const d of newDocs) await api('file_add', {module: 'LIBRARY', ref_id: id, name: d.nom, mime: d.mime, b64: d.b64});
    for (const p of newPh) await api('file_add', {module: 'LIBRARY', ref_id: id, name: p.nom, mime: p.mime, b64: p.b64, thumb_b64: p.thumb});
    delete LIBF[id]; await reloadLib();
  }, () => reloadLib());
}

// ------------------------------------------------------------ Titre de l'onglet : page en cours (+ nom du dossier quand une fenêtre est ouverte)
(function(){
  let q = 0, last = '';
  const upd = () => {
    q = 0; let t = 'Watson';
    try {
      if (typeof ME !== 'undefined' && ME && typeof cur === 'string' && cur) {
        const M = MODS[cur];
        const page = cur === '_home' ? 'Accueil' : cur === '_admin' ? 'Administration' : M ? M.label : '';
        let sub = '';
        if ($('#mSet').classList.contains('on')) sub = 'Paramètres';
        else if ($('#mLib').classList.contains('on')) sub = (($('#sLib h3') || {}).textContent || '').trim();
        else if ($('#mDet').classList.contains('on') && det) {
          if (det.r && M) sub = String((M.title || M.name)(det.r) || '').trim().toUpperCase();
          else if (!det.ghost) sub = 'Nouveau';
        }
        t = ['Watson', page, sub].filter(Boolean).join(' · ');
      }
    } catch (e) {}
    if (t !== last) { last = t; document.title = t; }
  };
  const sched = () => { if (!q) q = requestAnimationFrame(upd); };
  ['mDet', 'mSet', 'mLib'].forEach(id => { const el = document.getElementById(id); if (el) new MutationObserver(sched).observe(el, {attributes: true, attributeFilter: ['class']}); });
  ['main', 'sDet', 'sLib'].forEach(id => { const el = document.getElementById(id); if (el) new MutationObserver(sched).observe(el, {childList: true, subtree: id === 'main'}); });
  upd();
})();

// ------------------------------------------------------------ Pulsation « urgent » : l'horloge globale ne tourne que si une pastille urgente est à l'écran
(function(){
  const root = document.documentElement; let q = 0;
  const upd = () => { q = 0; const on = !!document.querySelector('.urgb,.bb.u'); if (on !== root.classList.contains('pulse')) root.classList.toggle('pulse', on); };
  new MutationObserver(() => { if (!q) q = requestAnimationFrame(upd); }).observe(document.body, {childList: true, subtree: true});
  upd();
})();

// ------------------------------------------------------------ Infobulles design (remplacent les bulles natives)
(function(){
  const tip = document.createElement('div'); tip.id = 'tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
  let cur = null, tm = 0;
  const hide = () => { clearTimeout(tm); tip.classList.remove('on'); cur = null; };
  // Le zoom de la page (réglage « taille du texte ») décale les coordonnées : on mesure l'écart réel avant de placer la bulle
  const probe = () => {
    tip.style.left = '0px'; tip.style.top = '0px'; const p0 = tip.getBoundingClientRect();
    tip.style.left = '100px'; tip.style.top = '100px'; const p1 = tip.getBoundingClientRect();
    return {k: (p1.left - p0.left) / 100 || 1, cx: p0.left, cy: p0.top, w: p0.width, h: p0.height};
  };
  const show = el => {
    const t = el.getAttribute('data-tip'); if (!t) return;
    cur = el; tip.textContent = t; tip.className = 'on';
    const r = el.getBoundingClientRect(), p = probe(), vw = document.documentElement.clientWidth * p.k;
    let x = r.left + r.width / 2 - p.w / 2; x = Math.max(8, Math.min(vw - p.w - 8, x));
    let y = r.top - p.h - 12, below = false; if (y < 8) { y = r.bottom + 12; below = true; }
    tip.style.left = (x - p.cx) / p.k + 'px'; tip.style.top = (y - p.cy) / p.k + 'px'; tip.style.setProperty('--ax', (r.left + r.width / 2 - x) / p.k + 'px');
    tip.className = (below ? 'below ' : '') + 'on';
  };
  const arm = el => {
    const t = el.getAttribute('title'); if (!t) return;
    if (!el.hasAttribute('aria-label') && !el.textContent.trim()) el.setAttribute('aria-label', t);
    el.setAttribute('data-tip', t); el.removeAttribute('title');
  };
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[title],[data-tip]'); if (!el || el === cur) return;
    if (!window.matchMedia('(hover:hover)').matches) return;
    arm(el); clearTimeout(tm); tm = setTimeout(() => show(el), 350);
  });
  document.addEventListener('mouseout', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hide(); });
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[title],[data-tip]'); if (el) { arm(el); show(el); } });
  ['focusout', 'mousedown', 'scroll', 'keydown'].forEach(ev => document.addEventListener(ev, hide, true));
})();
