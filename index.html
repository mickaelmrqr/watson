<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181F">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@500;700&display=swap" rel="stylesheet">
<title>Watson</title>
<style>
:root{
  --bg:#15181F; --panel:#1D222C; --raised:#272E3B; --line:#343C4C;
  --ink:#F1F4FA; --mut:#A3AEC2;
  --blue:#4A94FF; --orange:#FF8A1F; --green:#3ECF8E; --red:#FF5C5C;
  --ease:cubic-bezier(.2,.8,.2,1);
  --body:'DM Sans',system-ui,sans-serif; --disp:'Sora','DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font:16.5px/1.5 var(--body);color:var(--ink);background:
  radial-gradient(900px 420px at 85% -10%,rgba(74,148,255,.14),transparent 60%),
  radial-gradient(700px 380px at -10% 110%,rgba(255,138,31,.08),transparent 60%),var(--bg);
  min-height:100vh;background-attachment:fixed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- En-tête */
header{display:flex;align-items:center;gap:10px;padding:10px 20px;position:sticky;top:0;z-index:5;
  background:rgba(21,24,31,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);min-height:62px}
.logo{display:flex;align-items:center;gap:12px;flex:1;font:700 22px var(--disp);letter-spacing:.2px}
.logo img{width:38px;height:38px;border-radius:10px;display:block}
#who{color:var(--mut);font-weight:500}
#sync{font-size:13px;font-weight:500;color:var(--mut);display:flex;align-items:center;gap:7px}
#sync .dot{width:9px;height:9px;border-radius:50%;background:var(--green);transition:background .3s}
#sync.work .dot{background:var(--orange);animation:pulse 1s infinite}
#sync.err .dot{background:var(--red)}
@keyframes pulse{50%{transform:scale(1.7);opacity:.5}}
.ico{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:transparent;border:1px solid transparent;color:var(--ink);cursor:pointer;font-size:17px;transition:background .18s,border-color .18s,transform .18s var(--ease),color .18s}
.ico:hover{background:var(--raised);border-color:var(--line);transform:translateY(-1px);color:#fff}
.ico.on{background:var(--raised);border-color:var(--blue);color:var(--blue)}
.ico.warn:hover{color:var(--orange);border-color:rgba(255,138,31,.5)}
.ico.sm{width:38px;height:38px}
/* Onglet « Mes identifiants » fixé en haut, au milieu */
#bQR{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:9px;
  background:linear-gradient(180deg,#2c3446,#232a39);color:var(--ink);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;
  padding:9px 20px 11px;font:700 14.5px var(--disp);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35);
  transition:padding .22s var(--ease),box-shadow .22s,border-color .22s}
#bQR:hover{padding-bottom:16px;border-color:var(--orange);box-shadow:0 12px 28px rgba(255,138,31,.25)}
#bQR svg{color:var(--orange)}

/* ---------- Onglets des modules */
nav{display:flex;justify-content:center;padding:22px 16px 6px}
.seg{position:relative;display:inline-flex;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.seg .ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:12px;background:linear-gradient(135deg,#3f86f0,#2a6fdb);box-shadow:0 6px 18px rgba(74,148,255,.35);transition:transform .35s var(--ease),width .35s var(--ease)}
.seg button{position:relative;z-index:1;display:flex;align-items:center;gap:9px;font:700 16px var(--disp);color:var(--mut);background:transparent;border:0;border-radius:12px;padding:11px 26px;cursor:pointer;transition:color .2s,transform .2s var(--ease)}
.seg button:hover{color:#fff;transform:translateY(-1px)}
.seg button.on{color:#fff}
main{padding:14px 22px 50px;max-width:1500px;margin:0 auto}

/* ---------- Champs et boutons */
input,select,textarea{font:inherit;color:var(--ink);padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);width:100%;transition:border-color .18s,box-shadow .18s,background .18s}
input:hover,select:hover,textarea:hover{border-color:#4a5468}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,148,255,.25)}
select option{background:var(--panel)}
.up{text-transform:uppercase}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
.bar input,.bar select{width:auto;flex:1;min-width:160px}
button{font-family:inherit;cursor:pointer}
.p{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:var(--orange);color:#1a1206;border:0;border-radius:11px;padding:12px 20px;font:700 15.5px var(--disp);transition:transform .18s var(--ease),box-shadow .18s,filter .18s}
.p:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,138,31,.38);filter:brightness(1.06)}
.p:active{transform:translateY(0) scale(.97)}
.s{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:10px 15px;font:500 15px var(--body);transition:border-color .18s,background .18s,transform .18s var(--ease),color .18s}
.s:hover{border-color:var(--blue);color:#fff;background:#2f3949;transform:translateY(-1px)}
.s:active{transform:scale(.96)}
.s.go{border-color:rgba(74,148,255,.55);color:#d3e4ff}
.s[disabled],.p[disabled],.ico[disabled]{opacity:.45;pointer-events:none}

/* ---------- Cartes */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:800px){.grid{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px 24px;overflow:hidden;cursor:pointer;
  transition:transform .22s var(--ease),border-color .22s,box-shadow .22s,background .22s}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rail,var(--line));transition:width .22s var(--ease)}
.card:hover{transform:translateY(-3px);border-color:#55607a;background:#212733;box-shadow:0 14px 34px rgba(0,0,0,.38)}
.card:hover:before{width:9px}
.card.urg{--rail:var(--orange);box-shadow:0 0 0 1px rgba(255,138,31,.28)}
.card.st-go{--rail:var(--blue)} .card.st-ok{--rail:var(--green)} .card.urg:before{background:var(--orange)}
.card.tmp{opacity:.72;animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.name{font:700 22px/1.2 var(--disp);color:#fff;letter-spacing:.2px;word-break:break-word}
.refs{display:flex;gap:6px 16px;flex-wrap:wrap;margin:5px 0 2px}
.ref{font:700 17px var(--disp);letter-spacing:.3px;color:#9cc3ff;text-decoration:none;border-bottom:1px solid transparent;transition:color .15s,border-color .15s;word-break:break-all}
.ref:hover{color:#fff;border-color:var(--orange)}
.refs.solo .ref{font-size:23px}
.ref small{font:500 12.5px var(--body);color:var(--mut);margin-right:5px}
.m{color:var(--mut);font-size:15px;margin:3px 0}
.tags{margin:9px 0 6px;display:flex;gap:7px;flex-wrap:wrap}
.tag{font-size:13.5px;font-weight:700;border-radius:9px;padding:4px 11px;background:var(--raised);color:var(--mut)}
.tag.go{background:rgba(74,148,255,.2);color:#a9cbff}
.tag.ok{background:rgba(62,207,142,.17);color:#86e5b8}
.tag.u{background:rgba(255,138,31,.22);color:#ffb766}
.tag.pr{background:rgba(255,255,255,.09);color:var(--ink)}
.act{display:flex;gap:8px;align-items:center;margin-top:12px}
.act .sp{flex:1}
.empty{color:var(--mut);padding:40px 0;text-align:center}

/* ---------- Menu des étapes */
#pop{position:fixed;z-index:60;min-width:270px;background:var(--raised);border:1px solid #4a5468;border-radius:14px;padding:6px;box-shadow:0 18px 44px rgba(0,0,0,.55);opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top left;pointer-events:none;transition:opacity .16s,transform .2s var(--ease)}
#pop.on{opacity:1;transform:none;pointer-events:auto}
#pop button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:transparent;border:0;color:var(--ink);text-align:left;font:500 15.5px var(--body);padding:11px 13px;border-radius:9px;transition:background .15s,padding .15s var(--ease)}
#pop button:hover{background:rgba(74,148,255,.2);padding-left:17px}
#pop button.cur{color:var(--mut);cursor:default;pointer-events:none}
#pop button.cur svg{color:var(--green)}

/* ---------- Fenêtres */
.modal{position:fixed;inset:0;background:rgba(10,12,16,.58);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .22s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{background:var(--panel);border:1px solid var(--line);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px;transform:translateY(40px);transition:transform .3s var(--ease)}
.sheet.wide{max-width:740px}
.modal.on .sheet{transform:none}
@media(min-width:800px){.modal{align-items:center}.sheet{border-radius:20px;transform:translateY(18px) scale(.96)}.modal.on .sheet{transform:none}}
.sh{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.sh .tt{flex:1;min-width:0}
.sh h3{font:700 25px/1.2 var(--disp);margin:0;word-break:break-word}
.sh .sub{color:var(--mut);font-size:14.5px;margin-top:2px}
label{display:block;font-weight:500;color:var(--mut);margin:14px 0 6px;font-size:14.5px}
.row{display:flex;gap:8px}.row>button{white-space:nowrap}
.chk{display:flex;align-items:center;gap:11px;color:var(--ink);font-weight:500;margin:10px 0;cursor:pointer;font-size:16px}
.chk input{width:20px;height:20px;accent-color:var(--blue);padding:0}
.multi{display:grid;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 12px}
.det{display:grid;grid-template-columns:150px 1fr;gap:4px 16px;margin-top:10px}
.det dt{color:var(--mut);font-size:14.5px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.det dd{margin:0;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);word-break:break-word;min-height:2.2em}
.det dd.none{color:#5f6a7e}
.foot{display:flex;gap:10px;margin-top:20px}
#scan video{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover}
.frame{position:relative}
.frame:after{content:"";position:absolute;left:12%;right:12%;top:40%;height:20%;border:2px solid var(--orange);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.ids{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.idc{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.idc b{display:block;font:700 15px var(--disp);margin-bottom:10px}
.qrt{background:#fff;border-radius:10px;padding:8px;display:inline-block;line-height:0}
.idc .s{margin-top:12px;width:100%}

/* ---------- Attente (flou + blocage) */
#busy{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(15,18,24,.45);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .2s;cursor:wait}
#busy.on{opacity:1;pointer-events:auto}
#busy div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 30px;font:700 17px var(--disp);display:flex;align-items:center;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--raised);border-top-color:var(--orange);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- Divers */
#login{text-align:center;padding:90px 20px}
#login h2{font:700 32px var(--disp);margin:16px 0 6px}
#login p{color:var(--mut)}
#lerr{color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--raised);border:1px solid var(--line);color:var(--ink);padding:12px 20px;border-radius:12px;z-index:120;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:14px;overflow:hidden}
td,th{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}
tr:hover td{background:#212733}
.hide{display:none!important}
@media(max-width:700px){#bQR{font-size:13px;padding:8px 14px 10px}.det{grid-template-columns:1fr}.seg button{padding:10px 16px}#who{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><img src="icon-192.png" alt="">Watson</div>
  <span id="sync" class="hide"><span class="dot"></span><span id="syncT">Synchronisé</span></span>
  <span id="who"></span>
  <button id="bSet" class="ico hide" title="Paramètres" aria-label="Paramètres"></button>
  <button id="bOut" class="ico warn hide" title="Quitter" aria-label="Quitter"></button>
</header>
<button id="bQR" class="hide"></button>
<div id="login"><div class="logo" style="justify-content:center;flex:none;font-size:36px"><img src="icon-192.png" alt="" style="width:54px;height:54px;border-radius:14px">Watson</div>
  <h2>Connexion</h2><p>Connecte-toi avec ton compte Google.</p><div id="gbtn" style="display:inline-block;margin-top:8px"></div><p id="lerr"></p></div>
<div id="app" class="hide"><nav id="nav"></nav><main id="main"></main></div>

<div class="modal" id="mDet"><div class="sheet wide" id="sDet"></div></div>
<div class="modal" id="mScan"><div class="sheet" id="scan"><h3 style="font:700 22px var(--disp);margin:0 0 12px">Scanner</h3><div class="frame"><video id="vid" playsinline muted></video></div><p id="scanMsg" class="m">Place le code-barres dans le cadre.</p><button class="s" id="scanX">Fermer</button></div></div>
<div class="modal" id="mQR"><div class="sheet"><div class="sh"><div class="tt"><h3>Mes identifiants</h3></div><button class="ico sm" id="qrX" aria-label="Fermer" title="Fermer"></button></div><div class="ids">
  <div class="idc"><b>Identifiant</b><div class="qrt" id="qrId"></div><button class="s" id="cpId">Copier</button></div>
  <div class="idc"><b>Mot de passe</b><div class="qrt" id="qrPw"></div><button class="s" id="cpPw">Copier</button></div></div></div></div>
<div id="pop"></div>
<div id="busy"><div><span class="spin"></span><span>Patienter…</span></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
// ------------------------------------------------------------ Icônes
const ic = p => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const IC = {
  pencil: ic('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  archive: ic('<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/>'),
  unarchive: ic('<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M12 18v-6"/><path d="m9.5 14.5 2.5-2.5 2.5 2.5"/>'),
  gear: ic('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>'),
  out: ic('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>'),
  key: ic('<circle cx="8" cy="15" r="4"/><path d="m10.85 12.15 8.9-8.9"/><path d="m18 5 3 3"/><path d="m15 8 2 2"/>'),
  close: ic('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'),
  chev: ic('<path d="m6 9 6 6 6-6"/>'),
  check: ic('<path d="M20 6 9 17l-5-5"/>'),
  scan: ic('<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>'),
  plus: ic('<path d="M12 5v14"/><path d="M5 12h14"/>'),
  AWB: ic('<path d="M4 5v14"/><path d="M8 5v14"/><path d="M12 5v14"/><path d="M16 5v10"/><path d="M20 5v14"/>'),
  SPARK: ic('<path d="M13 2 3 14h9l-1 8 10-12h-9Z"/>'),
  DOM: ic('<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-7h6v7"/>')
};
const SHERLOC = 'https://sherloc.dhl.com/#/hwb/';

// ------------------------------------------------------------ Modules
const MODS = {
  AWB: { label: 'AWB', name: r => r.nom_client, fields: [
    {k:'waybill',l:'Waybill',t:'scan',req:1},
    {k:'nom_client',l:'Nom du client',t:'text',up:1},
    {k:'categorie_id',l:'Catégorie',t:'cat'},
    {k:'remarque',l:'Remarque',t:'area'},
    {k:'location',l:'Location (étagère)',t:'scan'},
    {k:'urgent',l:'Urgent',t:'bool'},
    {k:'visibilite',l:'Visibilité',t:'vis'},
    {k:'commentaire',l:'Commentaire',t:'area'}],
    show:['categorie_id','remarque','location','commentaire'] },
  SPARK: { label: 'SPARK', name: r => '', fields: [
    {k:'waybill',l:'Waybill',t:'scan'},
    {k:'pid',l:'PID',t:'scan'},
    {k:'problemes',l:'Problèmes',t:'multi'},
    {k:'remarque',l:'Remarque',t:'area'},
    {k:'dom',l:'DOM',t:'bool'},
    {k:'wrong_ok',l:'Wrong OK',t:'bool'},
    {k:'visibilite',l:'Visibilité',t:'vis'}],
    show:['problemes','remarque'] },
  DOM: { label: 'DOM', name: r => r.nom_dest, fields: [
    {k:'waybill',l:'Waybill',t:'scan',req:1},
    {k:'pid',l:'PID',t:'scan'},
    {k:'nom_dest',l:'Nom du destinataire',t:'text',up:1},
    {k:'remarque',l:'Remarque',t:'area'},
    {k:'urgent',l:'Urgent',t:'bool'},
    {k:'ctc_details',l:'Contact (détails)',t:'area'},
    {k:'ctc_commercial',l:'Contact commercial',t:'area'},
    {k:'visibilite',l:'Visibilité',t:'vis'},
    {k:'commentaire',l:'Commentaire',t:'area'}],
    show:['remarque','commentaire'] }
};
const STEP_KIND = {EN_COURS:'go',ATTENTE_CLIENT:'go',ATTENTE_COMMERCIAL:'go',TERMINE:'ok',A_ARCHIVER:'ok',RTO_FAIT:'ok',INSTRUCTION_APPLIQUEE:'ok'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let token = sessionStorage.getItem('wtk'), ME = null, cur = null, rows = [], showArch = false, det = null;
const cache = {};
const key = () => cur + (showArch ? '_a' : '');

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
function fdate(v,time){if(!v)return '';const d=new Date(v);return d.toLocaleDateString('fr-FR')+(time?' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'')}
const link = (v, label) => v ? `<a class="ref" href="${SHERLOC}${encodeURIComponent(v)}" target="_blank" rel="noopener" title="Ouvrir dans Sherloc">${label ? `<small>${label}</small>` : ''}${esc(v)}</a>` : '';

// ------------------------------------------------------------ Attente bloquante (flou + « Patienter… »)
let busyN = 0;
function busy(on){ busyN = Math.max(0, busyN + (on ? 1 : -1)); $('#busy').classList.toggle('on', busyN > 0); }
async function wait(fn){ busy(true); try { return await fn(); } finally { busy(false); } }

// ------------------------------------------------------------ API + synchronisation en arrière-plan
async function api(action, p = {}) {
  const r = await fetch(WATSON.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({token, action, ...p})});
  const j = await r.json();
  if (!j.ok) { if (j.error === 'AUTH') { logout(); throw new Error('Session expirée'); } throw new Error(j.error); }
  return j.data;
}
let chain = Promise.resolve(), pending = 0, failed = false;
function setSync(){
  const s = $('#sync'); s.classList.remove('hide'); s.classList.toggle('work', pending > 0); s.classList.toggle('err', failed && pending === 0);
  $('#syncT').textContent = pending > 0 ? 'Synchronisation…' : failed ? 'Erreur de synchro' : 'Synchronisé';
}
function enqueue(task, onFail){
  pending++; failed = false; setSync();
  chain = chain.then(task).catch(e => { failed = true; toast(e.message); if (onFail) return onFail(); })
    .finally(() => { pending--; setSync(); });
  return chain;
}

// ------------------------------------------------------------ Connexion Google
window.onload = () => {
  const w = setInterval(() => { if (window.google && google.accounts) { clearInterval(w); initGoogle(); } }, 100);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  $('#bSet').innerHTML = IC.gear; $('#bOut').innerHTML = IC.out; $('#qrX').innerHTML = IC.close;
  $('#bQR').innerHTML = IC.key + 'Mes identifiants';
};
function initGoogle(){
  google.accounts.id.initialize({client_id: WATSON.CLIENT_ID, callback: r => { token = r.credential; sessionStorage.setItem('wtk', token); start(); }, auto_select: true});
  if (token) start(); else google.accounts.id.renderButton($('#gbtn'), {theme:'filled_black', size:'large', text:'signin_with', locale:'fr'});
}
function logout(){ sessionStorage.removeItem('wtk'); token = null; location.reload(); }
$('#bOut').onclick = logout;
$('#bSet').onclick = () => { showArch = false; openMod('_admin'); };

async function start(){
  try {
    ME = await wait(() => api('me'));
    $('#login').classList.add('hide'); $('#app').classList.remove('hide');
    ['#bOut', '#bQR'].forEach(s => $(s).classList.remove('hide'));
    if (ME.role === 'admin') $('#bSet').classList.remove('hide');
    $('#who').textContent = ME.prenom;
    const mods = Object.keys(MODS).filter(m => ME.rights[m]);
    $('#nav').innerHTML = `<div class="seg" id="seg"><i class="ind"></i>${mods.map(m => `<button data-m="${m}">${IC[m]}${MODS[m].label}</button>`).join('')}</div>`;
    $('#seg').onclick = e => { const b = e.target.closest('button'); if (b) { showArch = false; openMod(b.dataset.m); } };
    setSync(); openMod(mods[0] || '_admin'); if (document.fonts) document.fonts.ready.then(moveInd);
  } catch (e) { $('#lerr').textContent = e.message; sessionStorage.removeItem('wtk'); token = null; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && ME && cur && cur !== '_admin' && pending === 0) refresh(); });
window.addEventListener('resize', moveInd);
function moveInd(){
  const b = document.querySelector('#seg button.on'), ind = $('#seg .ind'); if (!ind) return;
  if (!b) { ind.style.width = '0'; return; }
  ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft}px)`;
}

// ------------------------------------------------------------ Liste
async function openMod(m){
  cur = m; closePop();
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#bSet').classList.toggle('on', m === '_admin'); moveInd();
  if (m === '_admin') return renderAdmin();
  if (cache[key()]) { rows = cache[key()]; renderList(); refresh(); return; }
  try { rows = await wait(() => api('list', {module: m, archives: showArch})); cache[key()] = rows; }
  catch (e) { return toast(e.message); }
  renderList();
}
async function refresh(){
  const m = cur, k = key();
  try {
    const fresh = await api('list', {module: m, archives: showArch});
    if (pending > 0) return;
    cache[k] = fresh;
    if (key() === k) { rows = fresh; drawCards(); }
  } catch (e) {}
}
const stepsOf = m => ME.etapes.filter(e => e.module === m).sort((a,b) => a.ordre - b.ordre);
const canWrite = () => ['ecriture','admin'].includes(ME.rights[cur]);

function renderList(){
  const steps = stepsOf(cur);
  $('#main').innerHTML = `<div class="bar">
    <input id="q" placeholder="Rechercher…" aria-label="Rechercher">
    <select id="fe" aria-label="Étape"><option value="">Toutes les étapes</option>${steps.map(s=>`<option value="${s.code}">${esc(s.libelle_etat)}</option>`).join('')}</select>
    <button class="s" id="bArch">${showArch ? IC.unarchive + 'Voir les actifs' : IC.archive + 'Voir les archives'}</button>
    ${canWrite() && !showArch ? `<button class="p" id="bNew">${IC.plus}Nouveau</button>` : ''}</div><div class="grid" id="list"></div>`;
  $('#q').oninput = drawCards; $('#fe').onchange = drawCards;
  $('#bArch').onclick = () => { showArch = !showArch; openMod(cur); };
  if ($('#bNew')) $('#bNew').onclick = () => openDetail(null, true);
  $('#list').onclick = onListClick;
  drawCards();
}
function drawCards(){
  const list = $('#list'); if (!list) return;
  const q = $('#q').value.toLowerCase(), fe = $('#fe').value;
  const out = rows.filter(r => (!fe || r.etape === fe) && (!q || JSON.stringify(r).toLowerCase().includes(q)))
    .sort((a,b) => (b.urgent===true)-(a.urgent===true) || String(b.cree_le).localeCompare(String(a.cree_le)));
  list.innerHTML = out.map(card).join('') || '<div class="empty">Rien ici pour le moment.</div>';
}
function val(r, k){
  let v = r[k];
  if (k === 'categorie_id') { const c = ME.categories_awb.find(c => c.id === v); return c ? c.libelle : ''; }
  if (k === 'location') return v ? 'Étagère : ' + v : '';
  return v;
}
function card(r){
  const M = MODS[cur], steps = stepsOf(cur), st = steps.find(s => s.code === r.etape), kind = STEP_KIND[r.etape] || '';
  const name = String(M.name(r) || '').toUpperCase();
  const refs = r.waybill || r.pid
    ? `<div class="refs ${name ? '' : 'solo'}">${link(r.waybill, r.pid && r.waybill ? 'AWB' : '')}${link(r.pid, r.waybill ? 'PID' : '')}</div>` : '';
  const lines = M.show.map(k => { const v = val(r, k); return v ? `<div class="m">${esc(v)}</div>` : ''; }).join('');
  const tmp = r._tmp === true, w = canWrite(), dis = tmp ? 'disabled' : '';
  const acts = !w ? '' : showArch
    ? `<span class="sp"></span><button class="ico" ${dis} data-a="unarch" data-id="${r.id}" title="Désarchiver" aria-label="Désarchiver">${IC.unarchive}</button>`
    : `<button class="s go" ${dis} data-a="stepmenu" data-id="${r.id}">Étape${IC.chev}</button><span class="sp"></span>
       <button class="ico warn" ${dis} data-a="arch" data-id="${r.id}" title="Archiver" aria-label="Archiver">${IC.archive}</button>`;
  return `<div class="card st-${kind} ${r.urgent===true?'urg':''} ${tmp?'tmp':''}" data-id="${r.id}">
    ${name ? `<div class="name">${esc(name)}</div>` : ''}${refs || (name ? '' : '<div class="name">—</div>')}
    <div class="tags"><span class="tag ${kind}">${esc(st ? st.libelle_etat : r.etape)}</span>${r.urgent===true?'<span class="tag u">Urgent</span>':''}${r.visibilite==='prive'?'<span class="tag pr">Privé</span>':''}${tmp?'<span class="tag">Envoi…</span>':''}</div>
    ${lines}<div class="act">${acts}</div></div>`;
}

// ------------------------------------------------------------ Actions instantanées (envoi en arrière-plan)
function onListClick(e){
  if (e.target.closest('a')) return;                       // lien Sherloc : on laisse le navigateur agir
  const b = e.target.closest('button');
  const c = e.target.closest('.card'); if (!c) return;
  const id = c.dataset.id, r = rows.find(x => x.id === id); if (!r) return;
  if (!b) { if (!r._tmp) openDetail(r, false); return; }
  if (b.disabled) return;
  const a = b.dataset.a;
  if (a === 'stepmenu') return showStepMenu(b, r);
  if (a === 'arch' || a === 'unarch') doArchive(r, a === 'arch');
}
function doStep(r, code){
  const m = cur, k = key();
  const old = {etape:r.etape, etape_par:r.etape_par, etape_le:r.etape_le};
  Object.assign(r, {etape:code, etape_par:ME.email, etape_le:new Date().toISOString()});
  drawCards(); if (det && det.r === r) renderDet();
  enqueue(() => api('step', {module:m, id:r.id, etape:code}), () => { Object.assign(r, old); if (key() === k) drawCards(); if (det && det.r === r) renderDet(); });
}
function doArchive(r, archive){
  if (archive && !confirm('Archiver cet élément ?')) return;
  const m = cur, k = key(), before = rows;
  rows = rows.filter(x => x.id !== r.id); cache[k] = rows; drawCards();
  if (det && det.r === r) closeDet();
  enqueue(() => api(archive ? 'archive' : 'unarchive', {module:m, id:r.id}), () => { cache[k] = before; if (key() === k) { rows = before; drawCards(); } });
}

// ------------------------------------------------------------ Menu « Étape »
function closePop(){ $('#pop').classList.remove('on'); }
function showStepMenu(btn, r){
  const pop = $('#pop');
  pop.innerHTML = stepsOf(cur).map(s => `<button data-e="${s.code}" class="${s.code === r.etape ? 'cur' : ''}">${esc(s.libelle_bouton || s.libelle_etat)}${s.code === r.etape ? IC.check : ''}</button>`).join('');
  const rc = btn.getBoundingClientRect();
  pop.style.left = Math.min(rc.left, window.innerWidth - 300) + 'px'; pop.style.top = (rc.bottom + 6) + 'px';
  pop.classList.add('on');
  pop.onclick = e => { const o = e.target.closest('button'); if (!o || o.classList.contains('cur')) return; closePop(); doStep(r, o.dataset.e); };
}
document.addEventListener('mousedown', e => { if (!e.target.closest('#pop') && !e.target.closest('[data-a="stepmenu"]')) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePop(); if ($('#mScan').classList.contains('on')) stopScan(); else if ($('#mQR').classList.contains('on')) closeQR(); else if (det && !det.editing) closeDet(); } });
window.addEventListener('scroll', closePop, true);

// ------------------------------------------------------------ Fenêtre de détails (lecture / modification)
function openDetail(r, editing){ det = {r, editing: !!editing || !r}; renderDet(); $('#mDet').classList.add('on'); }
function closeDet(){ det = null; $('#mDet').classList.remove('on'); }
$('#mDet').addEventListener('mousedown', e => { if (e.target.id === 'mDet' && det && !det.editing) closeDet(); });

function renderDet(){
  if (!det) return;
  const M = MODS[det.r ? cur : cur], r = det.r;
  const el = $('#sDet');
  if (det.editing) {
    const v = r || {visibilite:'agence'};
    const f = M.fields.map(x => {
      const val = v[x.k] ?? '', id = 'f_' + x.k;
      if (x.t === 'bool') return `<label class="chk"><input type="checkbox" id="${id}" ${val===true?'checked':''}> ${x.l}</label>`;
      if (x.t === 'vis') return `<label for="${id}">${x.l}</label><select id="${id}"><option value="agence" ${val==='agence'?'selected':''}>Partagé dans l'agence</option><option value="prive" ${val==='prive'?'selected':''}>Privé (moi seul)</option></select>`;
      if (x.t === 'cat') return `<label for="${id}">${x.l}</label><select id="${id}"><option value=""></option>${ME.categories_awb.map(c=>`<option value="${c.id}" ${val===c.id?'selected':''}>${esc(c.libelle)}${c.visibilite==='prive'?' (perso)':''}</option>`).join('')}</select>`;
      if (x.t === 'multi') { const sel = String(val).split(';').map(s=>s.trim()).filter(Boolean);
        return `<label>${x.l}</label><div class="multi" id="${id}">${ME.problemes_spark.map(p=>`<label class="chk"><input type="checkbox" value="${esc(p)}" ${sel.includes(p)?'checked':''}> ${esc(p)}</label>`).join('')}</div>`; }
      if (x.t === 'area') return `<label for="${id}">${x.l}</label><textarea id="${id}" rows="2">${esc(val)}</textarea>`;
      if (x.t === 'scan') return `<label for="${id}">${x.l}</label><div class="row"><input id="${id}" value="${esc(val)}" autocomplete="off"><button type="button" class="s go" data-scan="${id}">${IC.scan}Scanner</button></div>`;
      return `<label for="${id}">${x.l}</label><input id="${id}" class="${x.up ? 'up' : ''}" value="${esc(val)}" autocomplete="off">`;
    }).join('');
    el.innerHTML = `<div class="sh"><div class="tt"><h3>${r ? 'Modifier' : 'Nouveau'} ${M.label}</h3></div>
      ${r ? `<button class="ico sm on" id="dPen" title="Annuler la modification" aria-label="Annuler la modification">${IC.pencil}</button>` : ''}
      <button class="ico sm" id="dX" title="Fermer" aria-label="Fermer">${IC.close}</button></div>${f}
      <div class="foot"><button class="p" id="fOk" style="flex:1">Enregistrer</button><button class="s" id="fX">Annuler</button></div>`;
    $('#fX').onclick = () => r ? (det.editing = false, renderDet()) : closeDet();
    if (r) $('#dPen').onclick = $('#fX').onclick;
    $('#dX').onclick = closeDet;
    el.onclick = e => { const s = e.target.closest('[data-scan]'); if (s) scanInto(s.dataset.scan); };
    el.querySelectorAll('input.up').forEach(i => i.addEventListener('input', () => { const p = i.selectionStart; i.value = i.value.toUpperCase(); i.setSelectionRange(p, p); }));
    $('#fOk').onclick = () => {
      const data = {};
      for (const x of M.fields) {
        const e2 = $('#f_' + x.k);
        if (x.t === 'bool') data[x.k] = e2.checked;
        else if (x.t === 'multi') data[x.k] = [...e2.querySelectorAll('input:checked')].map(i => i.value).join(' ; ');
        else data[x.k] = x.up ? e2.value.trim().toUpperCase() : e2.value.trim();
        if (x.req && !data[x.k]) return toast(x.l + ' obligatoire');
      }
      saveLocal(r, data);
      if (r) { det.editing = false; renderDet(); } else closeDet();
    };
    return;
  }
  // --- lecture
  const steps = stepsOf(cur), st = steps.find(s => s.code === r.etape), kind = STEP_KIND[r.etape] || '';
  const name = String(M.name(r) || '').toUpperCase();
  const rows2 = M.fields.map(x => {
    let v = r[x.k], h;
    if (x.k === 'waybill' || x.k === 'pid') h = link(v);
    else if (x.t === 'bool') h = v === true ? 'Oui' : 'Non';
    else if (x.t === 'vis') h = v === 'prive' ? 'Privé (moi seul)' : "Partagé dans l'agence";
    else if (x.t === 'cat') h = esc(val(r, x.k));
    else if (x.t === 'multi') h = esc(v).split(';').map(s => s.trim()).filter(Boolean).map(s => `<span class="tag" style="margin:0 5px 5px 0;display:inline-block">${s}</span>`).join('');
    else h = esc(x.up ? String(v || '').toUpperCase() : v).replace(/\n/g, '<br>');
    return `<dt>${x.l}</dt><dd class="${h ? '' : 'none'}">${h || '—'}</dd>`;
  }).join('');
  const meta = [];
  if (cur === 'DOM') meta.push(['J1', fdate(r.j1)], ['J4', fdate(r.j4)], ['J10', fdate(r.j10)]);
  meta.push(['Créé par', r.cree_par ? esc(r.cree_par) + ' · ' + fdate(r.cree_le, true) : ''], ['Dernière étape', r.etape_par ? esc(r.etape_par) + ' · ' + fdate(r.etape_le, true) : '']);
  if (r.archive === true) meta.push(['Archivé', esc(r.archive_par) + ' · ' + fdate(r.archive_le, true)]);
  const w = canWrite();
  el.innerHTML = `<div class="sh"><div class="tt"><h3>${name ? esc(name) : esc(r.waybill || r.pid || MODS[cur].label)}</h3>
      <div class="sub">${MODS[cur].label}</div></div>
      ${w && !showArch ? `<button class="ico sm" id="dPen" title="Modifier" aria-label="Modifier">${IC.pencil}</button>` : ''}
      <button class="ico sm" id="dX" title="Fermer" aria-label="Fermer">${IC.close}</button></div>
    <div class="tags"><span class="tag ${kind}">${esc(st ? st.libelle_etat : r.etape)}</span>${r.urgent===true?'<span class="tag u">Urgent</span>':''}${r.visibilite==='prive'?'<span class="tag pr">Privé</span>':''}</div>
    ${w && !showArch ? `<div class="act"><button class="s go" data-a="stepmenu" data-id="${r.id}">Étape${IC.chev}</button><span class="sp"></span><button class="ico warn" id="dArch" title="Archiver" aria-label="Archiver">${IC.archive}</button></div>` : ''}
    <dl class="det">${rows2}${meta.map(([a, b]) => `<dt>${a}</dt><dd class="${b ? '' : 'none'}">${b || '—'}</dd>`).join('')}</dl>`;
  $('#dX').onclick = closeDet;
  if ($('#dPen')) $('#dPen').onclick = () => { det.editing = true; renderDet(); };
  if ($('#dArch')) $('#dArch').onclick = () => doArchive(r, true);
  el.onclick = e => { const b = e.target.closest('[data-a="stepmenu"]'); if (b) showStepMenu(b, r); };
}

function saveLocal(r, data){
  const m = cur, k = key(), now = new Date().toISOString();
  if (r) Object.assign(r, data, {modifie_le: now});
  else {
    const row = Object.assign({id:'tmp_' + Date.now(), cree_par:ME.email, cree_le:now, etape:'A_FAIRE', etape_par:ME.email, etape_le:now, archive:false, _tmp:true}, data);
    rows.unshift(row); cache[k] = rows;
  }
  drawCards();
  enqueue(async () => {
    await api('save', {module:m, id: r ? r.id : null, data});
    if (pending === 1) { const fresh = await api('list', {module:m, archives:false}); cache[m] = fresh; if (key() === m) { rows = fresh; drawCards(); } }
  }, async () => { try { const fresh = await api('list', {module:m, archives:false}); cache[m] = fresh; if (key() === m) { rows = fresh; drawCards(); } } catch (e) {} });
}

// ------------------------------------------------------------ Scan code-barres
let reader = null;
async function scanInto(inputId){
  $('#mScan').classList.add('on'); $('#scanMsg').textContent = 'Place le code-barres dans le cadre.';
  try {
    reader = new ZXing.BrowserMultiFormatReader();
    await reader.decodeFromConstraints({video:{facingMode:'environment'}}, 'vid', res => {
      if (res) { $('#' + inputId).value = res.getText(); stopScan(); toast('Scanné : ' + res.getText()); }
    });
  } catch (e) { $('#scanMsg').textContent = 'Caméra indisponible : ' + e.message; }
}
function stopScan(){ if (reader) { reader.reset(); reader = null; } $('#mScan').classList.remove('on'); }
$('#scanX').onclick = stopScan;

// ------------------------------------------------------------ Mes identifiants (QR codes, sans texte en clair)
function qr(el, text){ el.innerHTML = ''; new QRCode(el, {text, width:160, height:160, colorDark:'#000', colorLight:'#fff', correctLevel: QRCode.CorrectLevel.M}); }
function closeQR(){ $('#mQR').classList.remove('on'); $('#qrId').innerHTML = ''; $('#qrPw').innerHTML = ''; }
$('#bQR').onclick = async () => {
  try {
    const c = await wait(() => api('my_creds'));
    if (!c.identifiant && !c.mot_de_passe) return toast('Aucun identifiant enregistré');
    qr($('#qrId'), c.identifiant || ' '); qr($('#qrPw'), c.mot_de_passe || ' ');
    $('#cpId').onclick = () => navigator.clipboard.writeText(c.identifiant).then(() => toast('Identifiant copié'));
    $('#cpPw').onclick = () => navigator.clipboard.writeText(c.mot_de_passe).then(() => toast('Mot de passe copié'));
    $('#mQR').classList.add('on');
  } catch (e) { toast(e.message); }
};
$('#qrX').onclick = closeQR;
$('#mQR').addEventListener('mousedown', e => { if (e.target.id === 'mQR') closeQR(); });

// ------------------------------------------------------------ Paramètres (admin)
async function renderAdmin(){
  let ps; try { ps = await wait(() => api('params_get')); } catch (e) { return toast(e.message); }
  $('#main').innerHTML = `<h3 style="font:700 24px var(--disp);margin:8px 0 14px">Paramètres</h3><table>${ps.map(p => `<tr><td><b>${esc(p.cle)}</b><div class="m">${esc(p.description)}</div></td>
    <td style="width:210px">${typeof p.valeur==='boolean'?`<input type="checkbox" style="width:22px;height:22px;accent-color:var(--blue)" data-k="${p.cle}" ${p.valeur?'checked':''}>`:`<input data-k="${p.cle}" value="${esc(p.valeur)}">`}<div class="m">${esc(p.unite)}</div></td></tr>`).join('')}</table>`;
  $('#main').onchange = async e => {
    const el = e.target; if (!el.dataset.k) return;
    try { await wait(() => api('params_set', {cle: el.dataset.k, valeur: el.type === 'checkbox' ? el.checked : el.value})); toast('Enregistré'); }
    catch (err) { toast(err.message); renderAdmin(); }
  };
}
</script>
