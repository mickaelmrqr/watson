<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181F">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@500;700&display=swap" rel="stylesheet">
<title>Watson</title>
<style>
:root{
  --bg:#15181F; --panel:#1D222C; --raised:#272E3B; --line:#343C4C;
  --ink:#F1F4FA; --mut:#A3AEC2;
  --blue:#3A8CFF; --orange:#FF5A2A; --green:#3ECF8E; --red:#FF5C5C;
  --ease:cubic-bezier(.2,.8,.2,1);
  --body:'DM Sans',system-ui,sans-serif; --disp:'Sora','DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font:16.5px/1.5 var(--body);color:var(--ink);background:
  radial-gradient(900px 420px at 85% -10%,rgba(74,148,255,.14),transparent 60%),
  radial-gradient(700px 380px at -10% 110%,rgba(255,90,42,.08),transparent 60%),var(--bg);
  min-height:100vh;background-attachment:fixed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- En-tête */
header{display:flex;align-items:center;gap:10px;padding:10px 20px;position:sticky;top:0;z-index:5;
  background:rgba(21,24,31,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);min-height:62px}
.logo{display:flex;align-items:center;gap:12px;flex:1;font:700 22px var(--disp);letter-spacing:.2px}
.logo img{height:40px;width:auto;aspect-ratio:1/1;object-fit:contain;display:block}
.ver{font:700 12px var(--disp);letter-spacing:.4px;color:#ff7a50;border:1px solid rgba(255,90,42,.55);background:rgba(255,90,42,.12);border-radius:8px;padding:2px 8px;margin-left:-2px;align-self:center}
#who{color:var(--mut);font-weight:500}
#sync{font-size:13px;font-weight:500;color:var(--mut);display:flex;align-items:center;gap:7px}
#sync .dot{width:9px;height:9px;border-radius:50%;background:var(--green);transition:background .3s}
#sync.work .dot{background:var(--orange);animation:pulse 1s infinite}
#sync.err .dot{background:var(--red)}
@keyframes pulse{50%{transform:scale(1.7);opacity:.5}}
.ico{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:transparent;border:1px solid transparent;color:var(--ink);cursor:pointer;font-size:17px;transition:background .18s,border-color .18s,transform .18s var(--ease),color .18s}
.ico:hover{background:var(--raised);border-color:var(--line);transform:translateY(-1px);color:#fff}
.ico.on{background:var(--raised);border-color:var(--blue);color:var(--blue)}
.ico.warn:hover{color:var(--orange);border-color:rgba(255,90,42,.5)}
.ico.sm{width:38px;height:38px}
/* ---------- Tuiles de modules */
nav{display:flex;justify-content:center;padding:20px 16px 4px}
.mods{display:grid;grid-template-columns:repeat(3,minmax(150px,230px));gap:14px;width:100%;justify-content:center}
.mod{position:relative;display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;color:var(--mut);overflow:hidden;
  transition:transform .22s var(--ease),border-color .22s,box-shadow .22s,background .22s,color .22s}
.mod:hover{transform:translateY(-3px);border-color:#55607a;color:#fff;background:#212733}
.mod .mi{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--raised);font-size:19px;transition:background .22s,color .22s}
.mod b{display:block;font:700 18px var(--disp);color:inherit;letter-spacing:.3px}
.mod small{display:block;font:500 13.5px var(--body);color:var(--mut);margin-top:1px}
.mod small i{font-style:normal;color:#ff8d70;font-weight:700}
.mod.on{color:#fff;border-color:var(--blue);background:linear-gradient(135deg,rgba(58,140,255,.22),rgba(58,140,255,.06));box-shadow:0 8px 26px rgba(58,140,255,.25)}
.mod.on .mi{background:var(--blue);color:#fff}
main{padding:14px 22px 50px;max-width:1500px;margin:0 auto}

/* ---------- Champs et boutons */
input,select,textarea{font:inherit;color:var(--ink);padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);width:100%;transition:border-color .18s,box-shadow .18s,background .18s}
input:hover,select:hover,textarea:hover{border-color:#4a5468}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,148,255,.25)}
select option{background:var(--panel)}
.up{text-transform:uppercase}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
.bar input,.bar select{width:auto;flex:1;min-width:160px}
button{font-family:inherit;cursor:pointer}
.p{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:var(--orange);color:#1a1206;border:0;border-radius:11px;padding:12px 20px;font:700 15.5px var(--disp);transition:transform .18s var(--ease),box-shadow .18s,filter .18s}
.p:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,90,42,.38);filter:brightness(1.06)}
.p:active{transform:translateY(0) scale(.97)}
.s{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:10px 15px;font:500 15px var(--body);transition:border-color .18s,background .18s,transform .18s var(--ease),color .18s}
.s:hover{border-color:var(--blue);color:#fff;background:#2f3949;transform:translateY(-1px)}
.s:active{transform:scale(.96)}
.s.go{border-color:rgba(74,148,255,.55);color:#d3e4ff}
.s[disabled],.p[disabled],.ico[disabled]{opacity:.45;pointer-events:none}

/* ---------- Cartes */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:800px){.grid{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px 16px 11px 22px;overflow:hidden;cursor:pointer;
  transition:transform .22s var(--ease),border-color .22s,box-shadow .22s,background .22s}
.card{display:flex;flex-direction:column}
.card>*{position:relative;z-index:1}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rail,var(--line));transition:width .22s var(--ease)}
.card:hover{transform:translateY(-3px);border-color:#55607a;background:#212733;box-shadow:0 14px 34px rgba(0,0,0,.38)}
.card:hover:before{width:9px}
.card.st-go{--rail:var(--blue)} .card.st-ok{--rail:var(--green)}
.card.tmp{opacity:.72;animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
@keyframes wave{0%,100%{border-color:var(--line);box-shadow:0 0 0 0 rgba(255,70,70,0)}50%{border-color:rgba(255,84,84,.8);box-shadow:0 0 16px 1px rgba(255,70,70,.32)}}
.card.urg{animation:wave 3.4s ease-in-out infinite}
.card.urg:hover{animation:none;border-color:rgba(255,84,84,.85);box-shadow:0 14px 34px rgba(0,0,0,.38),0 0 16px rgba(255,70,70,.3)}
.r1,.r2{display:flex;align-items:center;gap:10px;min-width:0}
.r1 .name,.r1 .refs{flex:1;min-width:0}
.name{font:700 22px/1.25 var(--disp);color:#fff;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.refs{display:flex;gap:4px 16px;flex-wrap:wrap;margin:3px 0 1px;flex:1}
.ref{font:700 17px var(--disp);letter-spacing:.3px;color:#9cc3ff;text-decoration:none;border-bottom:1px solid transparent;transition:color .15s,border-color .15s;word-break:break-all}
.ref:hover{color:#fff;border-color:var(--orange)}
.refs.solo{margin:0}.refs.solo .ref{font-size:22px}
.ref small{font:500 12.5px var(--body);color:var(--mut);margin-right:5px}
.bub{display:inline-flex;align-items:center;gap:5px;flex:none;font:700 13.5px var(--disp);color:#ffb9a0;background:rgba(255,90,42,.16);border:1px solid rgba(255,90,42,.4);border-radius:999px;padding:3px 11px 3px 8px}
.bub svg{width:1em;height:1em}
.m{color:var(--mut);font-size:15px;margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m.cat{color:#ff9d80;font-weight:700;font-size:14.5px}
.tag{font-size:13px;font-weight:700;border-radius:9px;padding:3px 10px;background:var(--raised);color:var(--mut);white-space:nowrap;flex:none}
.tag.go{background:rgba(58,140,255,.2);color:#a9cbff}
.tag.ok{background:rgba(62,207,142,.17);color:#86e5b8}
.tag.u{background:rgba(255,92,92,.18);color:#ff9d9d}
.tag.pr{background:rgba(255,255,255,.09);color:var(--ink)}
.act{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:auto;padding-top:10px}
.act .s{padding:8px 22px}
.empty{color:var(--mut);padding:40px 0;text-align:center}

/* ---------- Menu des étapes : bandeau au milieu de la page */
#mBand{z-index:70}
#mBand .sheet{max-width:1000px;width:94vw;border-radius:20px;padding:22px 22px 24px}
.bt{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.bt b{font:700 21px var(--disp);color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt span{color:var(--mut);font-size:14.5px}
.flow{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:4px 0 2px}
.flow .stp{flex:1 1 0;min-width:140px;display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:0;color:var(--mut);font:500 15px/1.25 var(--body);padding:4px 8px;text-align:center;position:relative;transition:color .15s,transform .18s var(--ease)}
.flow .stp:hover{color:#fff;transform:translateY(-3px)}
.flow .stp .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--disp);background:var(--bg);border:2px solid var(--line);color:var(--mut);z-index:1;transition:background .15s,border-color .15s}
.flow .stp:hover .dot{border-color:var(--blue)}
.flow .stp:not(:last-child):after{content:"";position:absolute;top:24px;left:calc(50% + 26px);right:calc(-50% + 26px);height:2px;background:var(--line)}
.flow .stp.done .dot{background:rgba(62,207,142,.2);border-color:var(--green);color:var(--green)}
.flow .stp.done:not(:last-child):after{background:var(--green)}
.flow .stp.cur{color:#fff;cursor:default}
.flow .stp.cur .dot{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 6px rgba(58,140,255,.25)}
.flow .stp .wh{font:500 13px/1.3 var(--body);color:var(--mut);min-height:2.6em}
.flow .stp .wh b{display:block;color:#cfd8ea;font-weight:700}
.flow .stp.none .wh{opacity:.4}

/* ---------- Fenêtres */
.modal{position:fixed;inset:0;background:rgba(10,12,16,.58);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .22s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{background:var(--panel);border:1px solid var(--line);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px;transform:translateY(40px);transition:transform .3s var(--ease)}
.sheet.wide{max-width:740px}
.modal.on .sheet{transform:none}
@media(min-width:800px){.modal{align-items:center}.sheet{border-radius:20px;transform:translateY(18px) scale(.96)}.modal.on .sheet{transform:none}}
.sh{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.sh .tt{flex:1;min-width:0}
.sh h3{font:700 25px/1.2 var(--disp);margin:0;word-break:break-word}
.sh .sub{color:var(--mut);font-size:14.5px;margin-top:2px}
label{display:block;font-weight:500;color:var(--mut);margin:14px 0 6px;font-size:14.5px}
.row{display:flex;gap:8px}.row>button{white-space:nowrap}
.chk{display:flex;align-items:center;gap:11px;color:var(--ink);font-weight:500;margin:10px 0;cursor:pointer;font-size:16px}
.chk input{width:20px;height:20px;accent-color:var(--blue);padding:0}
.multi{display:grid;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 12px}
.det{display:grid;grid-template-columns:150px 1fr;gap:4px 16px;margin-top:10px}
.det dt{color:var(--mut);font-size:14.5px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.det dd{margin:0;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);word-break:break-word;min-height:2.2em}
.det dd.none{color:#5f6a7e}
.det dd{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.det dd>input:not([type=checkbox]),.det dd>select,.det dd>textarea,.det dd .row{flex:1;min-width:0}
.det dd input:not([type=checkbox]),.det dd select,.det dd textarea{padding:4px 10px;font-size:16px;border-radius:8px;line-height:1.4}
.det dd textarea{resize:none;overflow:hidden;display:block}
.det dd .row input{flex:1;min-width:0}
.det dd .chk{margin:2px 0}
.det dd input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);padding:0}
.det dd.ed{padding:3px 0}
.bbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bb{display:inline-flex;align-items:center;gap:6px;font:700 13.5px var(--disp);border-radius:999px;padding:4px 12px 4px 9px;background:var(--raised);color:var(--ink);border:1px solid var(--line)}
.bb svg{width:1.05em;height:1.05em}
.bb.u{background:rgba(255,70,70,.16);border-color:rgba(255,84,84,.55);color:#ff9d9d;animation:wave 3.4s ease-in-out infinite}
.bb.sh{color:#a9cbff;border-color:rgba(58,140,255,.45);background:rgba(58,140,255,.14)}
.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.dt3{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px 11px;overflow:hidden}
.dt3:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.dt3 small{display:block;font:700 12.5px var(--disp);letter-spacing:.5px;color:var(--mut)}
.dt3 b{display:block;font:700 19px var(--disp);color:#fff;margin-top:2px}
.dt3 span{font-size:13px;color:var(--mut)}
.dt3.now:before{background:var(--blue)} .dt3.soon:before{background:var(--orange)} .dt3.late:before{background:var(--red)} .dt3.late b{color:#ff9d9d}
.dstat{display:flex;align-items:center;gap:10px;margin:10px 0 4px;transition:opacity .2s}
.dstat .sp{flex:1}
.dstat.lock{opacity:.4;pointer-events:none}
.ico.ok{color:var(--green);border-color:rgba(62,207,142,.5)}
.ico.ok:hover{background:rgba(62,207,142,.18);color:#fff}
.sec{font:700 16px var(--disp);margin:22px 0 4px;color:var(--ink)}
.hist{display:grid;gap:0;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:150px 1fr;gap:4px 16px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:15px}
.hist .hd{color:var(--mut);font-size:14px}
.hist .hw{color:var(--mut);font-size:13px}
.hist .arr{color:var(--orange);margin:0 4px}
#mAsk{z-index:90}
#mAsk .sheet{max-width:420px}
#mAsk p{color:var(--mut);margin:8px 0 0}
.foot{display:flex;gap:10px;margin-top:20px}
#scan video{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover}
.frame{position:relative}
.frame:after{content:"";position:absolute;left:12%;right:12%;top:40%;height:20%;border:2px solid var(--orange);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.ids{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.idc{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.idc b{display:block;font:700 15px var(--disp);margin-bottom:10px}
.qrt{background:#fff;border-radius:10px;padding:8px;display:inline-block;line-height:0}
.idc .s{margin-top:12px;width:100%}

/* ---------- Attente (flou + blocage) */
#busy{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(15,18,24,.45);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .2s;cursor:wait}
#busy.on{opacity:1;pointer-events:auto}
#busy div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 30px;font:700 17px var(--disp);display:flex;align-items:center;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--raised);border-top-color:var(--orange);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- Divers */
#login{text-align:center;padding:90px 20px}
#login h2{font:700 32px var(--disp);margin:16px 0 6px}
#login p{color:var(--mut)}
#lerr{color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--raised);border:1px solid var(--line);color:var(--ink);padding:12px 20px;border-radius:12px;z-index:120;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:14px;overflow:hidden}
td,th{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}
tr:hover td{background:#212733}
/* recherche + suggestions */
.sbox{position:relative;flex:1;min-width:220px}
.sbox input{width:100%}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--raised);border:1px solid #4a5468;border-radius:14px;padding:6px;box-shadow:0 18px 44px rgba(0,0,0,.5);display:none;max-height:60vh;overflow:auto}
.sug.on{display:block}
.sug button{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;color:var(--ink);text-align:left;padding:9px 11px;border-radius:9px;font:500 15px var(--body);transition:background .15s}
.sug button:hover,.sug button.hl{background:rgba(58,140,255,.2)}
.sug .si{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--bg);color:var(--blue);flex:none}
.sug .st{flex:1;min-width:0}.sug .st b{display:block;font:700 15.5px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .st small{color:var(--mut);font-size:13px}
.sug .hs{color:var(--orange);display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;flex:none}
.sug .none{color:var(--mut);padding:12px;text-align:center}
/* paramètres */
.set{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.snav{display:grid;gap:4px;position:sticky;top:78px}
.snav h5{font:700 12.5px var(--disp);color:var(--mut);letter-spacing:.5px;margin:12px 10px 4px}
.snav button{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;color:var(--mut);border-radius:11px;padding:10px 12px;font:500 15.5px var(--body);text-align:left;transition:all .18s var(--ease)}
.snav button:hover{background:var(--panel);color:#fff;transform:translateX(2px)}
.snav button.on{background:var(--panel);border-color:var(--blue);color:#fff}
.spane{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px 22px;min-height:300px}
.spane h3{font:700 22px var(--disp);margin:0 0 4px}
.spane .lead{color:var(--mut);margin:0 0 14px;font-size:15px}
.frm{display:grid;grid-template-columns:200px 1fr;gap:10px 16px;align-items:center;max-width:640px}
.frm label{margin:0}
.prow{display:grid;grid-template-columns:1fr 190px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.prow b{display:block;font-weight:700}.prow .m{margin:2px 0 0;font-size:14px;-webkit-line-clamp:3}
.prow .u{color:var(--mut);font-size:13px;margin-top:3px}
.sw{position:relative;width:46px;height:26px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--raised);border:1px solid var(--line);border-radius:999px;transition:background .2s,border-color .2s;cursor:pointer}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#aab4c8;transition:transform .22s var(--ease),background .2s}
.sw input:checked+i{background:rgba(58,140,255,.35);border-color:var(--blue)}
.sw input:checked+i:before{transform:translateX(20px);background:#fff}
.ntab{width:100%;max-width:560px;background:transparent}
.ntab td,.ntab th{padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
.ntab th{color:var(--mut);font-size:13.5px;text-align:center;font-weight:700}.ntab td+td,.ntab th+th{text-align:center}
.ntab tr:hover td{background:transparent}
.utab td,.utab th{padding:10px 8px;font-size:14.5px}
.utab th{color:var(--mut);font-weight:700;font-size:13px;white-space:nowrap}
.utab select{padding:5px 8px;font-size:14px;width:auto;min-width:100px}
.soon{display:inline-block;margin-top:6px;border:1px dashed var(--line);border-radius:12px;padding:16px 18px;color:var(--mut)}
@media(max-width:800px){.set{grid-template-columns:1fr}.snav{position:static;grid-template-columns:1fr 1fr}.frm,.prow{grid-template-columns:1fr}.utab{display:block;overflow-x:auto}}
.hide{display:none!important}
@media(max-width:700px){.mods{grid-template-columns:repeat(3,1fr);gap:8px}.mod{flex-direction:column;text-align:center;padding:10px 6px;gap:6px}.mod small{font-size:11.5px}.mod b{font-size:15px}.det,.hist li{grid-template-columns:1fr}.flow .stp{min-width:96px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><img src="icon-192.png" alt="" width="40" height="40">Watson<span class="ver">v4</span></div>
  <span id="sync" class="hide"><span class="dot"></span><span id="syncT">Synchronisé</span></span>
  <button id="bQR" class="ico hide" title="Mes identifiants" aria-label="Mes identifiants"></button>
  <button id="bSet" class="ico hide" title="Paramètres" aria-label="Paramètres"></button>
  <button id="bOut" class="ico warn hide" title="Quitter" aria-label="Quitter"></button>
</header>
<div id="login"><div class="logo" style="justify-content:center;flex:none;font-size:36px"><img src="icon-192.png" alt="" width="58" height="58" style="height:58px">Watson<span class="ver" style="font-size:15px">v4</span></div>
  <h2>Connexion</h2><p>Connecte-toi avec ton compte Google.</p><div id="gbtn" style="display:inline-block;margin-top:8px"></div><p id="lerr"></p></div>
<div id="app" class="hide"><nav id="nav"></nav><main id="main"></main></div>

<div class="modal" id="mDet"><div class="sheet wide" id="sDet"></div></div>
<div class="modal" id="mScan"><div class="sheet" id="scan"><h3 style="font:700 22px var(--disp);margin:0 0 12px">Scanner</h3><div class="frame"><video id="vid" playsinline muted></video></div><p id="scanMsg" class="m">Place le code-barres dans le cadre.</p><button class="s" id="scanX">Fermer</button></div></div>
<div class="modal" id="mQR"><div class="sheet"><div class="sh"><div class="tt"><h3>Mes identifiants</h3></div><button class="ico sm" id="qrX" aria-label="Fermer" title="Fermer"></button></div><div class="ids">
  <div class="idc"><b>Identifiant</b><div class="qrt" id="qrId"></div><button class="s" id="cpId">Copier</button></div>
  <div class="idc"><b>Mot de passe</b><div class="qrt" id="qrPw"></div><button class="s" id="cpPw">Copier</button></div></div></div></div>
<div class="modal" id="mBand"><div class="sheet" id="band"></div></div>
<div class="modal" id="mAsk"><div class="sheet"><div class="sh"><div class="tt"><h3 id="askT"></h3></div></div><p id="askP"></p>
  <div class="foot"><button class="p" id="askOk" style="flex:1"></button><button class="s" id="askNo">Annuler</button></div></div></div>
<div id="busy"><div><span class="spin"></span><span>Patienter…</span></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
// ------------------------------------------------------------ Icônes
const ic = p => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const IC = {
  pencil: ic('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  archive: ic('<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/>'),
  unarchive: ic('<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M12 18v-6"/><path d="m9.5 14.5 2.5-2.5 2.5 2.5"/>'),
  gear: ic('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>'),
  out: ic('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>'),
  qr: ic('<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><path d="M15 15h2v2"/><path d="M21 15v.01"/><path d="M15 21h2"/><path d="M21 19v2"/><path d="M12 3v6"/><path d="M12 13v2"/><path d="M3 12h2"/><path d="M9 12h6"/>'),
  alert: '<svg viewBox="0 0 24 24"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  bell: ic('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'),
  globe: ic('<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18"/>'),
  chart: ic('<path d="M3 3v18h18"/><path d="M7 15v-4"/><path d="M12 15V7"/><path d="M17 15v-6"/>'),
  clock: ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  users: ic('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>'),
  lock: ic('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  pin: ic('<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>'),
  band: ic('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15h18"/><path d="M8 19h.01"/><path d="M12 19h.01"/><path d="M16 19h.01"/>'),
  glide: ic('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M13 8h4"/><path d="M13 12h4"/><path d="M13 16h4"/>'),
  close: ic('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'),
  chev: ic('<path d="m6 9 6 6 6-6"/>'),
  check: ic('<path d="M20 6 9 17l-5-5"/>'),
  scan: ic('<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>'),
  plus: ic('<path d="M12 5v14"/><path d="M5 12h14"/>'),
  AWB: ic('<path d="M4 5v14"/><path d="M8 5v14"/><path d="M12 5v14"/><path d="M16 5v10"/><path d="M20 5v14"/>'),
  SPARK: ic('<path d="M13 2 3 14h9l-1 8 10-12h-9Z"/>'),
  DOM: ic('<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-7h6v7"/>')
};
const SHERLOC = 'https://sherloc.dhl.com/#/hwb/';

// ------------------------------------------------------------ Modules
const MODS = {
  AWB: { label: 'AWB', name: r => r.nom_client, fields: [
    {k:'waybill',l:'Waybill',t:'scan',req:1},
    {k:'nom_client',l:'Nom du client',t:'text',up:1},
    {k:'categorie_id',l:'Catégorie',t:'cat'},
    {k:'remarque',l:'Remarque',t:'area'},
    {k:'location',l:'Location (étagère)',t:'scan'},
    {k:'urgent',l:'Urgent',t:'bool'},
    {k:'visibilite',l:'Visibilité',t:'vis'},
    {k:'commentaire',l:'Commentaire',t:'area'}],
    show:['categorie_id','remarque'] },
  SPARK: { label: 'SPARK', name: r => r.nom_client, fields: [
    {k:'waybill',l:'Waybill',t:'scan'},
    {k:'nom_client',l:'Nom du client',t:'text',up:1},
    {k:'pid',l:'PID',t:'scan'},
    {k:'problemes',l:'Problèmes',t:'multi'},
    {k:'remarque',l:'Remarque',t:'area'},
    {k:'wrong_ok',l:'Wrong OK',t:'bool'},
    {k:'visibilite',l:'Visibilité',t:'vis'}],
    show:['problemes','remarque'] },
  DOM: { label: 'DOM', name: r => r.nom_dest, fields: [
    {k:'waybill',l:'Waybill',t:'scan',req:1},
    {k:'pid',l:'PID',t:'scan'},
    {k:'nom_dest',l:'Nom du destinataire',t:'text',up:1},
    {k:'remarque',l:'Remarque',t:'area'},
    {k:'urgent',l:'Urgent',t:'bool'},
    {k:'ctc_details',l:'Contact (détails)',t:'area'},
    {k:'ctc_commercial',l:'Contact commercial',t:'area'},
    {k:'visibilite',l:'Visibilité',t:'vis'},
    {k:'commentaire',l:'Commentaire',t:'area'}],
    show:['remarque','commentaire'] }
};
const STEP_KIND = {EN_COURS:'go',ATTENTE_CLIENT:'go',ATTENTE_COMMERCIAL:'go',TERMINE:'ok',A_ARCHIVER:'ok',RTO_FAIT:'ok',INSTRUCTION_APPLIQUEE:'ok'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let token = sessionStorage.getItem('wtk'), cur = null, rows = [], showArch = false, det = null;
let ME = null; window.ME = null;
const cache = {};
const key = () => cur + (showArch ? '_a' : '');

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
function fdate(v,time){if(!v)return '';const d=new Date(v);const tz=(window.ME&&ME.prefs&&ME.prefs.tz)||undefined;const o=tz?{timeZone:tz}:{};return d.toLocaleDateString('fr-FR',o)+(time?' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',...o}):'')}
const link = (v, label) => v ? `<a class="ref" href="${SHERLOC}${encodeURIComponent(v)}" target="_blank" rel="noopener" title="Ouvrir dans Sherloc">${label ? `<small>${label}</small>` : ''}${esc(v)}</a>` : '';

// ------------------------------------------------------------ Attente bloquante (flou + « Patienter… »)
let busyN = 0;
function busy(on){ busyN = Math.max(0, busyN + (on ? 1 : -1)); $('#busy').classList.toggle('on', busyN > 0); }
async function wait(fn){ busy(true); try { return await fn(); } finally { busy(false); } }

// ------------------------------------------------------------ API + synchronisation en arrière-plan
async function api(action, p = {}) {
  const r = await fetch(WATSON.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({token, action, ...p})});
  const j = await r.json();
  if (!j.ok) { if (j.error === 'AUTH') { logout(); throw new Error('Session expirée'); } throw new Error(j.error); }
  return j.data;
}
let chain = Promise.resolve(), pending = 0, failed = false;
function setSync(){
  const s = $('#sync'); s.classList.remove('hide'); s.classList.toggle('work', pending > 0); s.classList.toggle('err', failed && pending === 0);
  $('#syncT').textContent = pending > 0 ? 'Synchronisation…' : failed ? 'Erreur de synchro' : 'Synchronisé';
}
function enqueue(task, onFail){
  pending++; failed = false; setSync();
  chain = chain.then(task).catch(e => { failed = true; toast(e.message); if (onFail) return onFail(); })
    .finally(() => { pending--; setSync(); });
  return chain;
}

// ------------------------------------------------------------ Connexion Google
window.onload = () => {
  const w = setInterval(() => { if (window.google && google.accounts) { clearInterval(w); initGoogle(); } }, 100);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  $('#bSet').innerHTML = IC.gear; $('#bOut').innerHTML = IC.out; $('#qrX').innerHTML = IC.close;
  $('#bQR').innerHTML = IC.qr;
};
function initGoogle(){
  google.accounts.id.initialize({client_id: WATSON.CLIENT_ID, callback: r => { token = r.credential; sessionStorage.setItem('wtk', token); start(); }, auto_select: true});
  if (token) start(); else google.accounts.id.renderButton($('#gbtn'), {theme:'filled_black', size:'large', text:'signin_with', locale:'fr'});
}
function logout(){ sessionStorage.removeItem('wtk'); token = null; location.reload(); }
$('#bOut').onclick = logout;
$('#bSet').onclick = () => { showArch = false; setSec = 'profil'; openMod('_admin'); };

async function start(){
  try {
    ME = await wait(() => api('me', {device: /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 'Smartphone' : 'Navigateur', ua: navigator.userAgent})); window.ME = ME;
    $('#login').classList.add('hide'); $('#app').classList.remove('hide');
    ['#bOut', '#bQR'].forEach(s => $(s).classList.remove('hide'));
    $('#bSet').classList.remove('hide');
    const mods = Object.keys(MODS).filter(m => ME.rights[m]);
    $('#nav').innerHTML = `<div class="mods" id="seg">${mods.map(m => `<button class="mod" data-m="${m}"><span class="mi">${IC[m]}</span><span><b>${MODS[m].label}</b><small id="cnt_${m}">…</small></span></button>`).join('')}</div>`;
    $('#seg').onclick = e => { const b = e.target.closest('button'); if (b) { showArch = false; openMod(b.dataset.m); } };
    setSync(); openMod(mods[0] || '_admin'); preload(mods);
  } catch (e) { $('#lerr').textContent = e.message; sessionStorage.removeItem('wtk'); token = null; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && ME && cur && cur !== '_admin' && pending === 0) refresh(); });
const moveInd = () => {};
function drawTiles(){
  document.querySelectorAll('.mod').forEach(b => {
    const m = b.dataset.m, r = cache[m]; const t = $('#cnt_' + m); if (!t) return;
    if (!r) { t.textContent = '…'; return; }
    const u = r.filter(x => x.urgent === true).length;
    t.innerHTML = `${r.length} en cours` + (u ? ` · <i>${u} urgent${u > 1 ? 's' : ''}</i>` : '');
  });
}
async function preload(mods){
  for (const m of mods) { if (cache[m]) continue; try { cache[m] = await api('list', {module:m, archives:false}); } catch (e) {} drawTiles(); }
}

// ------------------------------------------------------------ Liste
async function openMod(m){
  cur = m; closePop();
  document.querySelectorAll('#seg .mod').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#bSet').classList.toggle('on', m === '_admin'); moveInd();
  if (m === '_admin') return renderAdmin();
  if (cache[key()]) { rows = cache[key()]; renderList(); refresh(); return; }
  try { rows = await wait(() => api('list', {module: m, archives: showArch})); cache[key()] = rows; }
  catch (e) { return toast(e.message); }
  renderList();
}
async function refresh(){
  const m = cur, k = key();
  try {
    const fresh = await api('list', {module: m, archives: showArch});
    if (pending > 0) return;
    cache[k] = fresh;
    if (key() === k) { rows = fresh; drawCards(); }
  } catch (e) {}
}
const stepsOf = m => ME.etapes.filter(e => e.module === m).sort((a,b) => a.ordre - b.ordre);
const canWrite = () => ['ecriture','admin'].includes(ME.rights[cur]);

function renderList(){
  const steps = stepsOf(cur);
  $('#main').innerHTML = `<div class="bar">
    <div class="sbox"><input id="q" placeholder="Rechercher un nom, un bordereau, un PID…" aria-label="Rechercher" autocomplete="off"><div class="sug" id="sug"></div></div>
    <select id="fe" aria-label="Étape"><option value="">Toutes les étapes</option>${steps.map(s=>`<option value="${s.code}">${esc(s.libelle_etat)}</option>`).join('')}</select>
    <button class="s" id="bArch">${showArch ? IC.unarchive + 'Voir les actifs' : IC.archive + 'Voir les archives'}</button>
    ${canWrite() && !showArch ? `<button class="p" id="bNew">${IC.plus}Nouveau</button>` : ''}</div><div class="grid" id="list"></div>`;
  initSearch(); $('#fe').onchange = drawCards;
  $('#bArch').onclick = () => { showArch = !showArch; openMod(cur); };
  if ($('#bNew')) $('#bNew').onclick = () => openDetail(null, true);
  $('#list').onclick = onListClick;
  drawCards();
}
function drawCards(){
  const list = $('#list'); if (!list) return;
  const fe = $('#fe').value;
  const out = rows.filter(r => !fe || r.etape === fe)
    .sort((a,b) => (b.urgent===true)-(a.urgent===true) || String(b.cree_le).localeCompare(String(a.cree_le)));
  list.innerHTML = out.map(card).join('') || '<div class="empty">Rien ici pour le moment.</div>'; drawTiles();
}
function val(r, k){
  let v = r[k];
  if (k === 'categorie_id') { const c = ME.categories_awb.find(c => c.id === v); return c ? c.libelle : ''; }
  if (k === 'location') return v ? 'Étagère : ' + v : '';
  return v;
}
const kindOf = r => {
  if (STEP_KIND[r.etape]) return STEP_KIND[r.etape];
  const st = stepsOf(cur), i = st.findIndex(x => x.code === r.etape), n = st.length;
  if (i <= 0) return '';
  return (n >= 4 && i >= n - 2) || (n < 4 && i === n - 1) ? 'ok' : 'go';
};
const stLabel = (code, m = cur) => { const s = ME.etapes.find(e => e.module === m && e.code === code); return s ? s.libelle_etat : code; };
function card(r){
  const M = MODS[cur], kind = kindOf(r), name = String(M.name(r) || '').toUpperCase();
  const tmp = r._tmp === true, w = canWrite();
  const tag = `<span class="tag ${tmp ? '' : kind}">${tmp ? 'Envoi…' : esc(stLabel(r.etape))}</span>`;
  const refs = r.waybill || r.pid
    ? `<div class="refs ${name ? '' : 'solo'}">${link(r.waybill, r.pid && r.waybill ? 'AWB' : '')}${link(r.pid, r.waybill ? 'PID' : '')}</div>` : '';
  const bub = r.location ? `<span class="bub" title="Étagère">${IC.pin}${esc(r.location)}</span>` : '';
  const head = name
    ? `<div class="r1"><div class="name" title="${esc(name)}">${esc(name)}</div>${tag}</div><div class="r2">${refs || '<div class="refs"></div>'}${bub}</div>`
    : `<div class="r1">${refs || '<div class="name">—</div>'}${tag}</div>`;
  const lines = M.show.map(k => { const v = val(r, k); return v ? `<div class="m ${k === 'categorie_id' ? 'cat' : ''}">${esc(v)}</div>` : ''; }).join('');
  const acts = w && !showArch ? `<div class="act"><button class="s go" ${tmp ? 'disabled' : ''} data-a="stepmenu" data-id="${r.id}">Étape${IC.chev}</button></div>` : '<div class="act" style="padding:0"></div>';
  return `<div class="card st-${kind} ${r.urgent === true ? 'urg' : ''} ${tmp ? 'tmp' : ''}" data-id="${r.id}">${head}${lines}${acts}</div>`;
}

// ------------------------------------------------------------ Recherche globale (suggestions)
const HLAB = {suppression:'Supprimé définitivement', creation:'Création', etape:"Changement d'étape", modification:'Modification', archivage:'Archivage', desarchivage:'Désarchivage'};
const IC_HIST = ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>');
let sTimer = 0, sSeq = 0, sItems = [], sHl = -1;
function localHits(q){
  const out = [];
  Object.keys(MODS).forEach(m => (cache[m] || []).forEach(r => {
    const hay = [r.waybill, r.pid, r.nom_client, r.nom_dest, r.remarque, r.location, r.commentaire].join(' ').toLowerCase();
    if (hay.includes(q)) out.push({kind:'row', module:m, id:r.id, title:String(r.nom_client || r.nom_dest || r.waybill || r.pid || '').toUpperCase(), sub:[r.waybill, r.pid].filter(Boolean).join(' · '), archive:false});
  }));
  return out.slice(0, 15);
}
function initSearch(){
  const q = $('#q'), box = $('#sug');
  q.oninput = () => {
    clearTimeout(sTimer); const v = q.value.trim().toLowerCase();
    if (v.length < 2) { box.classList.remove('on'); return; }
    drawSug(localHits(v), true);
    const n = ++sSeq;
    sTimer = setTimeout(async () => {
      try { const srv = await api('search', {q: v}); if (n !== sSeq) return;
        const seen = new Set(srv.map(x => x.module + x.id)); drawSug(srv.concat(localHits(v).filter(x => !seen.has(x.module + x.id)))); }
      catch (e) {}
    }, 260);
  };
  q.onkeydown = e => {

const H = {};                                              // historique par élément
function doStep(r, code){
  const m = cur, k = key();
  const old = {etape:r.etape, etape_par:r.etape_par, etape_le:r.etape_le};
  const ev = {date_heure:new Date().toISOString(), utilisateur:ME.email, action:'etape', ancienne_valeur:old.etape, nouvelle_valeur:code};
  Object.assign(r, {etape:code, etape_par:ME.email, etape_le:ev.date_heure});
  if (H[r.id]) H[r.id].unshift(ev);

  enqueue(() => api('step', {module:m, id:r.id, etape:code}), () => { Object.assign(r, old); if (H[r.id]) H[r.id] = H[r.id].filter(x => x !== ev); if (key() === k) drawCards(); if (det && det.r === r) renderDet(); });
}
async function doArchive(r, archive){

    if (k === 'visibilite') return v === 'prive' ? 'Privé' : 'Partagé'; const t = String(v); return t.length > 60 ? t.slice(0, 57) + '…' : t; };
  const items = h.map(x => {

function saveLocal(r, data){

    if (pending === 1) { const fresh = await api('list', {module:m, archives:false}); cache[m] = fresh; if (key() === m) { rows = fresh; drawCards(); } }
  }, async () => { try { const fresh = await api('list', {module:m, archives:false}); cache[m] = fresh; if (key() === m) { rows = fresh; drawCards(); } } catch (e) {} });
}

  dom_delai_j4_jours:'Délai J4', dom_delai_j10_jours:'Délai J10', dom_jours_ouvres:'Compter en jours ouvrés', heure_traitement_quotidien:'Heure du traitement', historique_retention_mois:"Conservation de l'historique"};
const PGROUP = {archi:['archivage_auto_dom_jours','archivage_auto_awb_jours','archivage_auto_spark_jours','suppression_apres_archive_dom_jours','suppression_apres_archive_awb_jours','suppression_apres_archive_spark_jours'],
  dom:['dom_delai_j4_jours','dom_delai_j10_jours','dom_jours_ouvres'], trait:['heure_traitement_quotidien'], histo:['historique_retention_mois']};
const NOTIFS = [['nouveau','Nouvel élément partagé'], ['etape',"Changement d'étape"], ['urgent','Élément urgent'], ['archive','Archivage'], ['echeance','Échéance DOM (J4 / J10)']];
const TZS = ['Europe/Paris','Europe/London','Europe/Berlin','Europe/Brussels','Europe/Zurich','Indian/Reunion','America/Martinique','America/New_York','Asia/Dubai'];
let setSec = 'profil', PARAMS = null;
const sw = (id, on, extra = '') => `<label class="sw"><input type="checkbox" id="${id}" ${on ? 'checked' : ''} ${extra}><i></i></label>`;

async function renderAdmin(){
  closeDet();
  if (isAdmin() && !PARAMS) { try { PARAMS = await wait(() => api('params_get')); } catch (e) { return toast(e.message); } }
  const secs = SECTIONS.filter(x => !x.adm || isAdmin());
  const nav = secs.map((x, i) => `${x.adm && !secs[i - 1].adm ? '<h5>ADMINISTRATEUR</h5>' : ''}<button data-s="${x.id}" class="${x.id === setSec ? 'on' : ''}">${x.l}</button>`).join('');
  $('#main').innerHTML = `<div class="set"><div class="snav">${nav}</div><div class="spane" id="spane"></div></div>`;
  $('.snav').onclick = e => { const b = e.target.closest('button'); if (b) { setSec = b.dataset.s; renderAdmin(); } };
  renderSec();
}
async function renderSec(){
  const el = $('#spane'), P = ME.prefs || {};
  if (setSec === 'profil') {
    let pr; try { pr = await wait(() => api('profile_get')); } catch (e) { return toast(e.message); }
    el.innerHTML = `<h3>Mon profil</h3><p class="lead">${esc(pr.prenom)} ${esc(pr.nom)} · ${esc(pr.email)}</p>
      <div class="frm"><label for="pTel">Téléphone</label><input id="pTel" value="${esc(pr.tel)}" autocomplete="off">
      <label for="pId">Identifiant</label><input id="pId" value="${esc(pr.identifiant)}" autocomplete="off">
      <label for="pPw">Mot de passe</label><input id="pPw" type="password" placeholder="Laisse vide pour ne pas le changer" autocomplete="new-password"></div>
      <p class="m" style="margin-top:12px">L'identifiant et le mot de passe sont affichés en QR code dans « Mes identifiants ».</p>
      <div class="foot"><button class="p" id="pOk">Enregistrer</button></div>`;
    $('#pOk').onclick = async () => { try { await wait(() => api('profile_set', {data:{tel:$('#pTel').value, identifiant:$('#pId').value, mot_de_passe:$('#pPw').value}})); $('#pPw').value = ''; toast('Profil enregistré'); } catch (e) { toast(e.message); } };
  } else if (setSec === 'notif') {
    const N = P.notif || {};
    el.innerHTML = `<h3>Notifications</h3><p class="lead">Choisis pour quelles actions tu veux être prévenu.</p>
      <table class="ntab"><tr><th style="text-align:left">Action</th><th>Notification</th><th>E-mail</th></tr>${NOTIFS.map(([k, l]) => `<tr><td>${l}</td><td>${sw('n_' + k + '_app', (N[k] || {}).app)}</td><td>${sw('n_' + k + '_mail', (N[k] || {}).mail)}</td></tr>`).join('')}</table>
      <p class="m" style="margin-top:12px">Les notifications dans l'appli arriveront avec la version smartphone. Les e-mails ne concernent que les éléments que tu as le droit de voir.</p>`;
    el.onchange = async () => {
      const notif = {}; NOTIFS.forEach(([k]) => { notif[k] = {app: $('#n_' + k + '_app').checked, mail: $('#n_' + k + '_mail').checked}; });
      ME.prefs = Object.assign({}, ME.prefs, {notif});
      try { await api('profile_set', {data:{prefs: ME.prefs}}); toast('Enregistré'); } catch (e) { toast(e.message); }
    };
  } else if (setSec === 'region') {
    const tz = P.tz || 'Europe/Paris';
    el.innerHTML = `<h3>Région</h3><p class="lead">Jours fériés et fuseau horaire.</p>
      <div class="prow"><div><b>Alsace-Moselle</b><div class="m">Compte le Vendredi saint et le 26 décembre comme jours fériés (calcul des délais DOM).</div></div><div>${sw('rAls', ME.region_alsace)}</div></div>
      <div class="prow"><div><b>Fuseau horaire</b><div class="m">Utilisé pour afficher les dates et les heures.</div></div><select id="rTz">${(TZS.includes(tz) ? TZS : [tz].concat(TZS)).map(z => `<option ${z === tz ? 'selected' : ''}>${z}</option>`).join('')}</select></div>`;
    $('#rAls').onchange = async e => { try { await api('region_set', {alsace: e.target.checked}); ME.region_alsace = e.target.checked; toast('Enregistré'); } catch (err) { toast(err.message); e.target.checked = !e.target.checked; } };
    $('#rTz').onchange = async e => { ME.prefs = Object.assign({}, ME.prefs, {tz: e.target.value}); try { await api('profile_set', {data:{prefs: ME.prefs}}); toast('Enregistré'); } catch (err) { toast(err.message); } };
  } else if (setSec === 'rapports') {
    el.innerHTML = `<h3>Rapports automatiques</h3><p class="lead">Envoi régulier d'un récapitulatif.</p><div class="soon">Bientôt disponible.</div>`;
  } else if (setSec === 'users') {
    await renderUsers(el);
  } else {
    const sec = SECTIONS.find(x => x.id === setSec), keys = PGROUP[setSec] || [];
    el.innerHTML = `<h3>${sec.l}</h3><p class="lead">Réservé à l'administrateur.</p>${keys.map(k => { const p = PARAMS.find(x => x.cle === k); if (!p) return '';
      return `<div class="prow"><div><b>${PLAB[k] || k}</b><div class="m">${esc(p.description)}</div></div><div>${typeof p.valeur === 'boolean' ? sw('p_' + k, p.valeur, `data-k="${k}"`) : `<input data-k="${k}" value="${esc(p.valeur)}" inputmode="numeric">`}<div class="u">${esc(p.unite)}</div></div></div>`; }).join('')}`;
    el.onchange = async e => {
      const t = e.target; if (!t.dataset.k) return; const v = t.type === 'checkbox' ? t.checked : t.value;
      try { await wait(() => api('params_set', {cle:t.dataset.k, valeur:v})); const p = PARAMS.find(x => x.cle === t.dataset.k); if (p) p.valeur = typeof p.valeur === 'boolean' ? v === true : (typeof p.valeur === 'number' ? Number(v) : v); toast('Enregistré'); }
      catch (err) { toast(err.message); PARAMS = null; renderAdmin(); }
    };
  }
}
async function renderUsers(el){
  let us; try { us = await wait(() => api('users_list')); } catch (e) { return toast(e.message); }
  const lv = (u, m) => { const cur = u.rights[m] || '', opts = m === 'PARAMETRES' ? [['', 'Aucun'], ['admin', 'Admin']] : [['', 'Aucun'], ['lecture', 'Lecture'], ['ecriture', 'Écriture'], ['admin', 'Admin']];
    return `<select data-u="${esc(u.email)}" data-m="${m}">${opts.map(([v, l]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${l}</option>`).join('')}</select>`; };
  el.innerHTML = `<h3>Utilisateurs</h3><p class="lead">Accès aux pages et connexions.</p>
    <table class="utab"><tr><th>Utilisateur</th><th>Dernière connexion</th><th>Actif</th><th>AWB</th><th>SPARK</th><th>DOM</th><th>Paramètres</th><th></th></tr>
    ${us.map(u => `<tr><td><b>${esc(u.prenom)} ${esc(u.nom)}</b><div class="m" style="margin:0">${esc(u.email)}</div></td>
      <td>${u.last ? fdate(u.last.date, true) + `<div class="m" style="margin:0">${u.last.appareil}</div>` : '<span class="m">Jamais</span>'}</td>
      <td>${sw('a_' + u.email, u.actif, `data-act="${esc(u.email)}"`)}</td>
      <td>${lv(u, 'AWB')}</td><td>${lv(u, 'SPARK')}</td><td>${lv(u, 'DOM')}</td><td>${lv(u, 'PARAMETRES')}</td>
      <td><button class="s" data-conn="${esc(u.email)}" data-nm="${esc(u.prenom)}">Connexions</button></td></tr>`).join('')}</table>`;
  el.onchange = async e => {
    const t = e.target;
    try {
      if (t.dataset.act) await wait(() => api('users_set', {email:t.dataset.act, actif:t.checked}));
      else if (t.dataset.u) await wait(() => api('users_set', {email:t.dataset.u, rights:{[t.dataset.m]: t.value}}));
      else return;
      toast('Enregistré');
    } catch (err) { toast(err.message); renderUsers(el); }
  };
  el.onclick = async e => {
    const b = e.target.closest('[data-conn]'); if (!b) return;
    let c; try { c = await wait(() => api('users_conn', {email:b.dataset.conn})); } catch (err) { return toast(err.message); }
    det = {r:null, editing:false, ghost:true};
    $('#sDet').innerHTML = `<div class="sh"><div class="tt"><h3>Connexions de ${esc(b.dataset.nm)}</h3><div class="sub">60 dernières</div></div><button class="ico sm" id="dX" aria-label="Fermer">${IC.close}</button></div>
      ${c.length ? `<ul class="hist">${c.map(x => `<li><div class="hd">${fdate(x.date, true)}</div><div>${x.appareil === 'Smartphone' ? 'Smartphone' : 'Navigateur'}</div></li>`).join('')}</ul>` : '<div class="m" style="margin-top:12px">Aucune connexion enregistrée.</div>'}`;
    $('#dX').onclick = closeDet; $('#mDet').classList.add('on');
  };
}
</script>
</body>
</html>
